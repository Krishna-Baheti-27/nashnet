yle=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #AEB6C6\">tick {{tick}}<\/span>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px\">\n        <div style=\"padding: 8px 10px; border-radius: 10px; background: rgba(45,212,167,0.08); border: 1px solid rgba(45,212,167,0.3)\">\n          <div style=\"font-size: 11px; color: #8A94A8\">Cooperative team · avg credits<\/div>\n          <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #2DD4A7\">{{lb.coopAvg}}<\/div>\n        <\/div>\n        <div style=\"padding: 8px 10px; border-radius: 10px; background: rgba(255,107,74,0.08); border: 1px solid rgba(255,107,74,0.3)\">\n          <div style=\"font-size: 11px; color: #8A94A8\">Selfish team · avg credits<\/div>\n          <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #FF8A6B\">{{lb.selfAvg}}<\/div>\n        <\/div>\n      <\/div>\n      <div aria-hidden=\"true\" style=\"display: flex; align-items: center; gap: 8px; padding: 12px 9px 6px; font-size: 11px; color: #8A94A8\">\n        <span style=\"width: 24px\">#<\/span>\n        <span style=\"flex: 1\">Tenant<\/span>\n        <span style=\"width: 48px; text-align: right\">Credits<\/span>\n        <span style=\"width: 82px; text-align: right\">SLA score<\/span>\n        <span style=\"width: 34px; text-align: right\" title=\"Rank change over the last 10 ticks\">10t<\/span>\n      <\/div>\n      <div role=\"list\" aria-label=\"Tenants ranked by credits\" style=\"position: relative; height: 400px\">\n        <sc-for list=\"{{lb.rows}}\" as=\"r\">\n          <button type=\"button\" role=\"listitem\" onClick=\"{{r.pick}}\" aria-label=\"{{r.aria}}\" style=\"position: absolute; left: 0; right: 0; top: {{r.top}}px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 8px; border: 1px solid {{r.border}}; background: {{r.bg}}; color: #E6EAF2; opacity: {{r.opacity}}; text-align: left; transition: top .45s ease, background .2s, opacity .3s\">\n            <span style=\"width: 24px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: {{r.rankColor}}\">{{r.rank}}<\/span>\n            <span style=\"width: 22px; height: 22px; flex: none; border-radius: 50%; background: {{r.color}}; color: {{r.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; line-height: 22px; text-align: center\">{{r.glyph}}<\/span>\n            <span style=\"flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px\"><span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600\">{{r.id}}<\/span> <span style=\"color: #AEB6C6\">{{r.name}}<\/span><\/span>\n            <span style=\"width: 48px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600\">{{r.credits}}<\/span>\n            <span style=\"width: 82px; display: flex; align-items: center; justify-content: flex-end; gap: 6px\">\n              <span style=\"width: 46px; height: 6px; border-radius: 3px; background: #1E2635; overflow: hidden\"><span style=\"display: block; height: 100%; width: {{r.sla}}%; background: {{r.slaColor}}; transition: width .3s\"><\/span><\/span>\n              <span style=\"width: 28px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{r.slaTextColor}}\">{{r.slaText}}<\/span>\n            <\/span>\n            <span style=\"width: 34px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{r.trendColor}}\">{{r.trend}}<\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"margin-top: 10px; font-size: 11px; line-height: 1.5; color: #8A94A8\">Credits: +2 per AI job served, minus audit fines and pricing. SLA score: uptime from 0–100; at 0 the tenant goes offline (OFF). 10t: rank change over the last 10 ticks. Click a row to inspect that tenant.<\/div>\n    <\/section>\n\n    <section aria-label=\"Tenant inspector\" style=\"background: #121722; border: 1px solid {{hl.inspector}}; box-shadow: {{hl.inspectorGlow}}; border-radius: 16px; padding: 18px\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8\">TENANT INSPECTOR<\/span>\n        <span style=\"font-size: 12px; color: #8A94A8\">click any circle on the map<\/span>\n      <\/div>\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-top: 14px\">\n        <div style=\"width: 48px; height: 48px; flex: none; border-radius: 50%; background: {{sel.color}}; color: #0B0E14; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 18px; line-height: 48px; text-align: center\">{{sel.glyph}}<\/div>\n        <div style=\"min-width: 0\">\n          <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700\">{{sel.id}} · The {{sel.short}}<\/div>\n          <div style=\"font-size: 12px; color: #8A94A8\">{{sel.strat}} · {{sel.team}} team<\/div>\n        <\/div>\n        <span style=\"margin-left: auto; padding: 4px 10px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; background: {{sel.statusBg}}; color: {{sel.statusFg}}\">{{sel.status}}<\/span>\n      <\/div>\n      <p style=\"margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: #C4CAD6\">{{sel.blurb}}<\/p>\n\n      <div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 14px\">\n        <sc-for list=\"{{sel.res}}\" as=\"rs\">\n          <div style=\"display: flex; align-items: center; gap: 10px\">\n            <span style=\"width: 92px; flex: none; font-size: 12px; color: #AEB6C6\">{{rs.label}}<\/span>\n            <div style=\"flex: 1; height: 8px; border-radius: 4px; background: #1E2635; overflow: hidden\"><div style=\"height: 100%; width: {{rs.w}}%; border-radius: 4px; background: {{rs.color}}; transition: width .3s\"><\/div><\/div>\n            <span style=\"width: 54px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px\">{{rs.val}}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px\">\n        <div style=\"padding: 10px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\"><div style=\"font-size: 11px; color: #8A94A8\">Credits earned<\/div><div style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 16px\">{{sel.credits}}<\/div><\/div>\n        <div style=\"padding: 10px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\"><div style=\"font-size: 11px; color: #8A94A8\">Last action<\/div><div style=\"font-weight: 500; font-size: 13px\">{{sel.last}}<\/div><\/div>\n      <\/div>\n\n      <div style=\"margin-top: 16px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8; margin-bottom: 8px\">WHO IT TRUSTS · FROM MEMORY<\/div>\n        <sc-if value=\"{{memOff}}\"><div style=\"font-size: 13px; color: #F2B862\">Memory is off under these rules: this tenant forgets every encounter.<\/div><\/sc-if>\n        <sc-if value=\"{{trustEmpty}}\"><div style=\"font-size: 13px; color: #8A94A8\">No encounters yet. Press Play.<\/div><\/sc-if>\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <sc-for list=\"{{trust}}\" as=\"t\">\n            <div style=\"display: flex; align-items: center; gap: 8px\">\n              <span style=\"width: 18px; height: 18px; border-radius: 50%; background: {{t.color}}; color: #0B0E14; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; line-height: 18px; text-align: center\">{{t.glyph}}<\/span>\n              <span style=\"width: 30px; font-family: 'JetBrains Mono', monospace; font-size: 12px\">{{t.peer}}<\/span>\n              <div style=\"flex: 1; height: 6px; border-radius: 3px; background: #1E2635; overflow: hidden\"><div style=\"height: 100%; width: {{t.pct}}%; background: {{t.bar}}\"><\/div><\/div>\n              <span style=\"width: 70px; text-align: right; font-size: 12px; color: {{t.bar}}\">{{t.word}}<\/span>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n\n      <div style=\"margin-top: 16px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8; margin-bottom: 8px\">WHAT IT WANTS TO DO NEXT · EXPECTED UTILITY<\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <sc-for list=\"{{cands}}\" as=\"cd\">\n            <div>\n              <div style=\"display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px\">\n                <span style=\"color: {{cd.fg}}\">{{cd.label}}<\/span>\n                <sc-if value=\"{{cd.chosen}}\"><span style=\"padding: 2px 6px; border-radius: 4px; background: #E6EAF2; color: #0B0E14; font-size: 10px; font-weight: 700\">TOP PICK<\/span><\/sc-if>\n                <span style=\"margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #AEB6C6\">{{cd.eu}}<\/span>\n              <\/div>\n              <div style=\"height: 6px; border-radius: 3px; background: #1E2635; overflow: hidden\"><div style=\"height: 100%; width: {{cd.w}}%; background: {{cd.bar}}; transition: width .3s\"><\/div><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; align-items: flex-start\">\n  <section aria-label=\"Narrator\" style=\"flex: 1 1 460px; min-width: 0; background: #121722; border: 1px solid {{hl.story}}; box-shadow: {{hl.storyGlow}}; border-radius: 16px; padding: 18px\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8\">NARRATOR · WHAT JUST HAPPENED<\/span>\n      <span style=\"font-size: 12px; color: #8A94A8\">newest first<\/span>\n    <\/div>\n    <sc-if value=\"{{noEvents}}\"><div style=\"padding: 20px 0; color: #8A94A8\">Nothing yet. Press Play and the story of the season appears here.<\/div><\/sc-if>\n    <div style=\"display: flex; flex-direction: column; gap: 8px\">\n      <sc-for list=\"{{stories}}\" as=\"e\">\n        <div style=\"display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\">\n          <span style=\"width: 72px; flex: none; padding: 3px 0; border-radius: 6px; text-align: center; font-size: 11px; font-weight: 700; background: {{e.bg}}; color: {{e.fg}}\">{{e.badge}}<\/span>\n          <span style=\"flex: 1; min-width: 0; font-size: 13px; line-height: 1.45\">{{e.story}}<\/span>\n          <span style=\"flex: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7D8799\">tick {{e.tick}}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n\n  <section aria-label=\"Outcome charts\" style=\"flex: 1 1 560px; min-width: 0; background: #121722; border: 1px solid {{hl.story}}; box-shadow: {{hl.storyGlow}}; border-radius: 16px; padding: 18px\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8; margin-bottom: 12px\">OUTCOMES OVER THE SEASON · x-axis = tick (0–150)<\/div>\n    <div style=\"display: flex; flex-direction: column; gap: 18px\">\n      <sc-for list=\"{{charts}}\" as=\"ch\">\n        <div>\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px\">\n            <span style=\"font-weight: 600\">{{ch.title}}<\/span>\n            <span style=\"font-size: 12px; color: #8A94A8\">{{ch.sub}}<\/span>\n            <span style=\"margin-left: auto; display: flex; gap: 12px; font-size: 12px\">\n              <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 3px; background: {{ch.c1}}\"><\/span>{{ch.l1}}<\/span>\n              <sc-if value=\"{{ch.two}}\"><span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 3px; background: {{ch.c2}}\"><\/span>{{ch.l2}}<\/span><\/sc-if>\n            <\/span>\n          <\/div>\n          <div style=\"display: flex; gap: 8px; margin-top: 8px\">\n            <div style=\"width: 30px; height: 96px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7D8799; text-align: right\"><span>{{ch.top}}<\/span><span>{{ch.bottom}}<\/span><\/div>\n            <div style=\"flex: 1; min-width: 0\">\n              <svg viewBox=\"0 0 600 96\" preserveAspectRatio=\"none\" width=\"100%\" height=\"96\" role=\"img\" aria-label=\"{{ch.aria}}\" style=\"display: block; background: #0B0E14; border-radius: 6px\">\n                <line x1=\"0\" y1=\"{{ch.refY}}\" x2=\"600\" y2=\"{{ch.refY}}\" stroke=\"#3A4458\" stroke-dasharray=\"4 4\" vector-effect=\"non-scaling-stroke\"><\/line>\n                <polyline points=\"{{ch.p1}}\" fill=\"none\" stroke=\"{{ch.c1}}\" stroke-width=\"2.4\" vector-effect=\"non-scaling-stroke\"><\/polyline>\n                <polyline points=\"{{ch.p2}}\" fill=\"none\" stroke=\"{{ch.c2}}\" stroke-width=\"2.4\" vector-effect=\"non-scaling-stroke\"><\/polyline>\n              <\/svg>\n              <div style=\"display: flex; justify-content: space-between; margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7D8799\"><span>0<\/span><span>{{ch.refLabel}}<\/span><span>150<\/span><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n<\/div>\n\n<\/div>\n<\/div>\n","style":"\nhtml{color-scheme:dark}\nbody{margin:0;background:#0B0E14}\n*{scrollbar-width:thin;scrollbar-color:#2A3242 transparent}\na{color:#AEB6C6}a:hover{color:#E6EAF2}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:.4}\nbutton:focus-visible,a:focus-visible{outline:2px solid #6E8BFF;outline-offset:2px}\n","script":"\nclass Component extends Screen {\n  eng() {\n    return this._E || (this._E = makeEngine());\n  }\n  scen() {\n    return {\n      none: { label: 'No rules', desc: 'Tenants forget every encounter; zones are a free-for-all.', regs: { memory: false }, color: '#8A94A8', tag: 'BASELINE' },\n      rep: { label: 'Memory + reputation', desc: 'Tenants remember cheaters and can check a public trust score.', regs: { memory: true, ledger: true }, color: '#6E8BFF', tag: 'FIXES CHEATING' },\n      quota: { label: 'Commons quotas', desc: 'Nobody takes more than 3 units or drains a zone below 40%.', regs: { memory: false, quotas: true }, color: '#E9A23B', tag: 'FIXES DRAINING' },\n      audit: { label: 'Random audits', desc: 'Cheats and over-drains are caught 40% of the time: fine + repayment.', regs: { memory: false, audits: true }, color: '#2DD4A7', tag: 'FIXES BOTH' }\n    };\n  }\n  cfg() {\n    const s = this.state || {};\n    const scenario = s.scenario || 'none';\n    const custom = s.custom || { memory: true, ledger: false, quotas: false, pricing: false, audits: false };\n    return {\n      playing: !!s.playing, speed: s.speed || 1, scarcity: s.scarcity || 'shortage', seed: s.seed || 166,\n      sel: s.sel || 'A6', tour: s.tour ?? 0, adv: !!s.adv, scenario: scenario, custom: custom,\n      regs: scenario === 'custom' ? custom : this.scen()[scenario].regs\n    };\n  }\n  ensureSim() {\n    const c = this.cfg();\n    const key = c.seed + '|' + c.scarcity + '|' + JSON.stringify(c.regs);\n    if (!this.sim || this.simKey !== key) {\n      this.sim = this.eng().create({ seed: c.seed, scarcity: c.scarcity, regs: c.regs });\n      this.sim._ranks = { 0: this.ranks(this.sim) };\n      this.simKey = key;\n    }\n    return this.sim;\n  }\n  ranks(S) {\n    const arr = S.agents.slice().sort((a, b) => (b.credits - a.credits) || (b.sla - a.sla) || (parseInt(a.id.slice(1), 10) - parseInt(b.id.slice(1), 10)));\n    const m = {}; arr.forEach((a, i) => { m[a.id] = i + 1; });\n    return m;\n  }\n  stepSim() {\n    const S = this.sim;\n    this.eng().step(S);\n    S._ranks = S._ranks || {};\n    S._ranks[S.tick] = this.ranks(S);\n  }\n  componentDidMount() { this.loop(); }\n  componentWillUnmount() { this.dead = true; clearTimeout(this.timer); }\n  loop() {\n    if (this.dead) return;\n    const c = this.cfg();\n    if (c.playing && this.sim) {\n      if (this.sim.tick >= 150 || !this.sim.agents.some(a => a.online)) this.setState({ playing: false });\n      else { this.stepSim(); this.forceUpdate(); }\n    }\n    const delay = c.speed === 4 ? 90 : c.speed === 2 ? 220 : 450;\n    this.timer = setTimeout(() => this.loop(), delay);\n  }\n  renderVals() {\n    const E = this.eng();\n    const S = this.ensureSim();\n    const c = this.cfg();\n    const ST = E.STRATS;\n    const set = p => this.setState(p);\n    const RGB = { compute: '233,162,59', bw: '56,189,248', power: '155,225,93' };\n    const HEX = { compute: '#E9A23B', bw: '#38BDF8', power: '#9BE15D' };\n    const LET = { compute: 'G', bw: 'B', power: 'P' };\n    const byId = {}; S.agents.forEach(a => { byId[a.id] = a; });\n    const sel = byId[c.sel] || S.agents[0];\n    const f1 = v => Math.max(0, v).toFixed(1);\n    const sm = E.summary(S);\n\n    const TOUR = [\n      { title: 'This is a shared city cloud', text: 'Coloured tiles are capacity zones (G = GPU, B = bandwidth, P = power); their fill shows what is left. Circles are AI tenants: colour and letter show their strategy.', hl: 'map' },\n      { title: 'Choose the rules, then press Play', text: 'Start with “No rules”. Press Play and watch tenants move to zones, collect resources and meet each other. Green lines are shares, orange lines are cheats.', hl: 'rules' },\n      { title: 'Click a tenant to see its mind', text: 'The inspector shows what it holds, who it trusts from memory, and which action it rates highest next. A6 is a Giver: watch what happens to it.', hl: 'inspector' },\n      { title: 'Read the story and the outcome charts', text: 'The narrator explains each event in plain English. The charts show tenants online, whether cheaters out-earn cooperators, and how full the zones are.', hl: 'story' },\n      { title: 'Change one rule and replay', text: 'Switch to “Random audits” and press Play again. Same map, same tenants, same seed: only the rule changed. Then compare all four side by side in the Showdown.', hl: 'rules' }\n    ];\n    const tourOn = c.tour >= 0;\n    const tStep = tourOn ? TOUR[c.tour] : TOUR[0];\n    const hlOn = k => tourOn && tStep.hl === k;\n    const hl = {\n      map: hlOn('map') ? '#6E8BFF' : '#1E2635', mapGlow: hlOn('map') ? '0 0 0 4px rgba(110,139,255,0.18)' : 'none',\n      controls: 'transparent',\n      rules: hlOn('rules') ? '#6E8BFF' : '#1E2635', rulesGlow: hlOn('rules') ? '0 0 0 4px rgba(110,139,255,0.18)' : 'none',\n      inspector: hlOn('inspector') ? '#6E8BFF' : '#1E2635', inspectorGlow: hlOn('inspector') ? '0 0 0 4px rgba(110,139,255,0.18)' : 'none',\n      story: hlOn('story') ? '#6E8BFF' : '#1E2635', storyGlow: hlOn('story') ? '0 0 0 4px rgba(110,139,255,0.18)' : 'none'\n    };\n\n    const SC = this.scen();\n    const scenarios = Object.keys(SC).map(k => {\n      const a = c.scenario === k;\n      return {\n        label: SC[k].label, desc: SC[k].desc, color: SC[k].color, tag: SC[k].tag, tagColor: a ? SC[k].color : '#7D8799', active: a,\n        border: a ? SC[k].color : '#1E2635', bg: a ? 'rgba(230,234,242,0.05)' : '#0B0E14',\n        pick: () => set({ scenario: k, playing: false })\n      };\n    });\n    const ADV = [\n      ['memory', 'Memory', 'Remember who cheated you'],\n      ['ledger', 'Reputation ledger', 'Public trust score'],\n      ['quotas', 'Commons quotas', 'Cap takes, keep 40% reserve'],\n      ['pricing', 'Congestion pricing', 'Draining zones costs credits'],\n      ['audits', 'Random audits', 'Catch cheats 40% of the time']\n    ];\n    const advRegs = ADV.map(g => {\n      const on = !!c.regs[g[0]];\n      return {\n        label: g[1], desc: g[2], on: on, track: on ? '#2DD4A7' : '#2A3242', knob: on ? 23 : 3,\n        toggle: () => { const n = Object.assign({ memory: false, ledger: false, quotas: false, pricing: false, audits: false }, c.regs); n[g[0]] = !n[g[0]]; set({ scenario: 'custom', custom: n, playing: false }); }\n      };\n    });\n    const pill = a => ({ bg: a ? '#E6EAF2' : 'transparent', fg: a ? '#0B0E14' : '#AEB6C6' });\n    const scarcities = ['abundant', 'normal', 'shortage'].map(k => Object.assign({ label: E.SCARCITY[k].label, active: c.scarcity === k, pick: () => set({ scarcity: k, playing: false }) }, pill(c.scarcity === k)));\n    const speeds = [[1, 'Slow'], [2, 'Normal'], [4, 'Fast']].map(v => Object.assign({ label: v[1], active: c.speed === v[0], pick: () => set({ speed: v[0] }) }, pill(c.speed === v[0])));\n\n    const zones = S.zones.map(z => ({\n      left: z.x * 28 + 2, top: z.y * 28 + 2, letter: LET[z.type],\n      border: 'rgba(' + RGB[z.type] + ',0.7)', bg: 'rgba(' + RGB[z.type] + ',0.08)',\n      fill: 'rgba(' + RGB[z.type] + ',0.55)', h: Math.round(100 * Math.max(0, z.amt) / z.max),\n      title: { compute: 'GPU cluster', bw: 'Fiber hub', power: 'Power station' }[z.type] + ' · ' + Math.round(100 * Math.max(0, z.amt) / z.max) + '% left'\n    }));\n    const links = S.links.map(l => {\n      const a = byId[l.a], b = byId[l.b];\n      const x1 = a.x * 28 + 14, y1 = a.y * 28 + 14, x2 = b.x * 28 + 14, y2 = b.y * 28 + 14;\n      return {\n        left: x1, top: y1, width: Math.max(1, Math.hypot(x2 - x1, y2 - y1)).toFixed(1),\n        angle: (Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI).toFixed(1),\n        color: l.kind === 'coop' ? '#2DD4A7' : '#FF6B4A', opacity: (0.3 + 0.7 * l.ttl / 5).toFixed(2)\n      };\n    });\n    const agents = S.agents.map(a => {\n      const s = ST[a.strat]; const isSel = a.id === sel.id; const fl = S.flash.indexOf(a.id) >= 0;\n      return {\n        id: a.id, glyph: a.online ? s.glyph : '×', left: a.x * 28 + 2, top: a.y * 28 + 2,\n        labelLeft: a.x * 28 + 4, labelTop: a.y >= 18 ? a.y * 28 - 12 : a.y * 28 + 25,\n        bg: a.online ? s.color : '#2A3242', fg: a.online ? '#0B0E14' : '#7D8799',\n        labelColor: isSel ? '#E6EAF2' : '#AEB6C6',\n        shadow: isSel ? '0 0 0 2px #0B0E14, 0 0 0 4px ' + s.color : (fl ? '0 0 12px 3px ' + s.color : 'none'),\n        z: isSel ? 6 : 4,\n        label: a.id + ', the ' + s.short + ' (' + s.name + ')' + (a.online ? '' : ', offline'),\n        pick: () => set({ sel: a.id })\n      };\n    });\n\n    const healthScore = 0.5 * sm.survival + 0.5 * Math.min(1, sm.reserve / 0.6);\n    const hc = healthScore >= 0.8 ? ['Healthy', '#2DD4A7'] : healthScore >= 0.55 ? ['Strained', '#E9A23B'] : ['Collapsing', '#FF6B4A'];\n    const adv = Math.round(sm.cheatAdv * 100);\n    const health = {\n      label: hc[0], color: hc[1], pct: Math.round(healthScore * 100),\n      online: sm.online, served: Math.round(sm.served * 100), reserve: Math.round(sm.reserve * 100),\n      cheat: S.tick === 0 ? '–' : (adv > 5 ? 'Yes, +' + adv + '%' : adv < -5 ? 'No, ' + adv + '%' : 'Even'),\n      cheatColor: S.tick === 0 ? '#AEB6C6' : adv > 5 ? '#FF8A6B' : '#2DD4A7',\n      cheatNote: 'selfish vs cooperative earnings'\n    };\n\n    const ss = ST[sel.strat];\n    const slaColor = sel.sla > 60 ? '#2DD4A7' : sel.sla > 30 ? '#E9A23B' : '#FF6B4A';\n    const selV = {\n      id: sel.id, glyph: sel.online ? ss.glyph : '×', color: sel.online ? ss.color : '#2A3242', strat: ss.name, short: ss.short,\n      team: ss.team === 'coop' ? 'Cooperative' : 'Selfish', blurb: ss.blurb,\n      credits: Math.round(sel.credits), last: sel.last,\n      status: sel.online ? 'ONLINE' : 'OFFLINE',\n      statusBg: sel.online ? 'rgba(45,212,167,0.14)' : 'rgba(255,107,74,0.14)', statusFg: sel.online ? '#2DD4A7' : '#FF8A6B',\n      res: [\n        { label: 'GPU', color: HEX.compute, val: f1(sel.compute), w: Math.min(100, Math.round(sel.compute / 12 * 100)) },\n        { label: 'Bandwidth', color: HEX.bw, val: f1(sel.bw), w: Math.min(100, Math.round(sel.bw / 12 * 100)) },\n        { label: 'Power', color: HEX.power, val: f1(sel.power), w: Math.min(100, Math.round(sel.power / 12 * 100)) },\n        { label: 'SLA uptime', color: slaColor, val: Math.round(sel.sla) + '/100', w: Math.round(sel.sla) }\n      ]\n    };\n    const trust = !c.regs.memory ? [] : Object.keys(sel.mem).map(k => ({ k: k, m: sel.mem[k] }))\n      .sort((p, q) => q.m.n - p.m.n).slice(0, 4).map(o => {\n        const pct = Math.round(100 * (o.m.c + 1) / (o.m.c + o.m.d + 2));\n        const ps = ST[byId[o.k].strat];\n        return { peer: o.k, glyph: ps.glyph, color: ps.color, pct: pct, bar: pct >= 60 ? '#2DD4A7' : pct >= 45 ? '#E9A23B' : '#FF6B4A', word: (pct >= 60 ? 'trusts ' : pct >= 45 ? 'unsure ' : 'distrusts ') + pct + '%' };\n      });\n\n    const on = S.agents.filter(a => a.online);\n    let near = null, nd = 99;\n    on.forEach(o => { if (o.id !== sel.id) { const d = Math.max(Math.abs(o.x - sel.x), Math.abs(o.y - sel.y)); if (d < nd) { nd = d; near = o; } } });\n    const need = E.poorest(sel);\n    const trustNear = near ? (c.regs.memory ? E.trustOf(sel, near.id) : 0.5) : 0.5;\n    const raw = [\n      { label: 'Run queued AI jobs', eu: Math.min(sel.compute, sel.bw, sel.power) * 1.2 },\n      { label: 'Go collect ' + E.LABEL[need], eu: Math.max(0.2, (8 - sel[need]) * 0.8) },\n      { label: near && nd <= 3 ? 'Share with ' + near.id : 'Share (nobody in reach)', eu: near && nd <= 3 ? (ss.team === 'coop' ? 4 - nd * 0.4 - (trustNear < 0.45 ? 3 : 0) : 1) : 0.4 },\n      { label: sel.strat === 'AGGR' ? 'Grab from a neighbour' : 'Keep everything (defect)', eu: ss.team === 'selfish' ? 5.2 : 1.1 }\n    ].map(o => ({ label: o.label, eu: Math.max(0.1, o.eu) }));\n    const mx = Math.max.apply(null, raw.map(o => o.eu));\n    const cands = raw.map(o => ({ label: o.label, eu: o.eu.toFixed(1), w: Math.round(100 * o.eu / mx), chosen: o.eu === mx, bar: o.eu === mx ? '#E6EAF2' : '#3A4458', fg: o.eu === mx ? '#E6EAF2' : '#AEB6C6' }));\n\n    const BADGE = {\n      SHARE: ['Shared', '#2DD4A7', 'rgba(45,212,167,0.14)'], SWAP: ['Swapped', '#C9A2FF', 'rgba(192,139,255,0.16)'],\n      CHEAT: ['Cheated', '#FF8A6B', 'rgba(255,107,74,0.15)'], REFUSE: ['Refused', '#F2B862', 'rgba(233,162,59,0.14)'],\n      GRAB: ['Grabbed', '#FF7AA8', 'rgba(255,77,141,0.15)'], AUDIT: ['Audit', '#E6EAF2', 'rgba(230,234,242,0.12)'],\n      OFFLINE: ['Offline', '#AEB6C6', 'rgba(138,148,168,0.16)']\n    };\n    const stories = S.events.slice(0, 7).map(e => ({ tick: e.tick, story: e.story, badge: BADGE[e.kind][0], fg: BADGE[e.kind][1], bg: BADGE[e.kind][2] }));\n\n    const H = S.hist;\n    const pts = (arr, max) => arr.length ? arr.map((v, i) => ((i + 1) * 4).toFixed(1) + ',' + (94 - Math.max(0, v) / max * 90).toFixed(1)).join(' ') : '0,94';\n    const cmax = Math.max(50, Math.max.apply(null, H.coopTeam.concat(H.selfTeam, [0])) * 1.1);\n    const charts = [\n      { title: 'Tenants online', sub: 'out of 10', c1: '#E6EAF2', l1: 'Online', two: false, c2: 'transparent', l2: '', p1: pts(H.online, 10), p2: '0,94', top: '10', bottom: '0', refY: 49, refLabel: 'dashed = 5 tenants', aria: 'Line chart of tenants online over the season' },\n      { title: 'Does cheating pay?', sub: 'average credits earned per tenant', c1: '#2DD4A7', l1: 'Cooperative team', two: true, c2: '#FF6B4A', l2: 'Selfish team', p1: pts(H.coopTeam, cmax), p2: pts(H.selfTeam, cmax), top: String(Math.round(cmax)), bottom: '0', refY: 94 - 10 / cmax * 90, refLabel: 'dashed = starting credits', aria: 'Line chart comparing credits of cooperative and selfish tenants' },\n      { title: 'Commons reserves', sub: 'average zone capacity left', c1: '#9BE15D', l1: 'Reserve %', two: false, c2: 'transparent', l2: '', p1: pts(H.reserve, 1), p2: '0,94', top: '100%', bottom: '0%', refY: 94 - 0.4 * 90, refLabel: 'dashed = 40% safe reserve', aria: 'Line chart of average zone reserves over the season' }\n    ];\n\n    const order = ['TFT', 'ALLC', 'TRADER', 'REP', 'ALLD', 'AGGR'];\n    const legend = order.map(k => {\n      const all = S.agents.filter(a => a.strat === k); const n = all.filter(a => a.online).length;\n      return { glyph: ST[k].glyph, color: ST[k].color, name: 'The ' + ST[k].short, count: n + '/' + all.length, countColor: n < all.length ? '#FF8A6B' : '#8A94A8' };\n    });\n\n    const rk = this.ranks(S);\n    const prevRk = (S._ranks || {})[Math.max(0, S.tick - 10)] || rk;\n    const teamAvg = t => { const g = S.agents.filter(a => ST[a.strat].team === t); return Math.round(g.reduce((p, a) => p + a.credits, 0) / g.length); };\n    const lb = {\n      coopAvg: teamAvg('coop'), selfAvg: teamAvg('selfish'),\n      rows: S.agents.map(a => {\n        const r = rk[a.id], d = prevRk[a.id] - r, s = ST[a.strat], isSel = a.id === sel.id;\n        const slaC = a.sla > 60 ? '#2DD4A7' : a.sla > 30 ? '#E9A23B' : '#FF6B4A';\n        return {\n          rank: r, top: (r - 1) * 40, id: a.id, name: 'The ' + s.short,\n          glyph: a.online ? s.glyph : '×', color: a.online ? s.color : '#2A3242', fg: a.online ? '#0B0E14' : '#7D8799',\n          credits: Math.round(a.credits),\n          sla: Math.max(0, Math.round(a.sla)), slaColor: slaC,\n          slaText: a.online ? String(Math.round(a.sla)) : 'OFF', slaTextColor: a.online ? '#E6EAF2' : '#FF8A6B',\n          trend: d > 0 ? '▲' + d : d < 0 ? '▼' + (-d) : '–',\n          trendColor: d > 0 ? '#2DD4A7' : d < 0 ? '#FF8A6B' : '#5C667A',\n          opacity: a.online ? 1 : 0.55,\n          bg: isSel ? 'rgba(230,234,242,0.08)' : '#0B0E14', border: isSel ? '#AEB6C6' : '#1E2635',\n          rankColor: r === 1 ? '#F2B862' : '#AEB6C6',\n          aria: 'Rank ' + r + ': ' + a.id + ', the ' + s.short + ', ' + Math.round(a.credits) + ' credits, SLA ' + (a.online ? Math.round(a.sla) : 'offline'),\n          pick: () => set({ sel: a.id })\n        };\n      })\n    };\n\n    const seasonOver = S.tick >= 150 || !S.agents.some(a => a.online);\n    const scenarioName = c.scenario === 'custom' ? 'CUSTOM RULES' : SC[c.scenario].label.toUpperCase();\n    let verdict;\n    if (sm.online >= 9 && adv <= 0) verdict = { title: 'The commons survived, and cheating did not pay.', color: '#2DD4A7', bg: 'rgba(45,212,167,0.08)', border: 'rgba(45,212,167,0.4)' };\n    else if (sm.online >= 8) verdict = { title: 'Most tenants survived' + (adv > 5 ? ', but cheaters still came out ahead.' : '.'), color: '#E9A23B', bg: 'rgba(233,162,59,0.08)', border: 'rgba(233,162,59,0.4)' };\n    else verdict = { title: 'The commons broke down.', color: '#FF8A6B', bg: 'rgba(255,107,74,0.08)', border: 'rgba(255,107,74,0.4)' };\n    verdict.text = sm.online + ' of 10 tenants online · ' + Math.round(sm.served * 100) + '% of jobs served · zones at ' + Math.round(sm.reserve * 100) + '% · selfish tenants earned ' + (adv >= 0 ? '+' : '') + adv + '% vs cooperative tenants.';\n\n    return {\n      tourOn: tourOn, tourBtn: tourOn ? 'Hide guided tour' : 'Show guided tour',\n      toggleTour: () => set({ tour: tourOn ? -1 : 0 }),\n      tour: { n: c.tour + 1, title: tStep.title, text: tStep.text, first: c.tour === 0, notLast: c.tour < 4, last: c.tour === 4 },\n      tourBack: () => set({ tour: Math.max(0, c.tour - 1) }), tourNext: () => set({ tour: Math.min(4, c.tour + 1) }),\n      hl: hl, scenarios: scenarios, scarcities: scarcities, speeds: speeds, seed: c.seed,\n      newSeed: () => set({ seed: c.seed + 1, playing: false }),\n      advOpen: c.adv, advLabel: c.adv ? 'Hide advanced rule
