display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px\">\n    <sc-for list=\"{{charts}}\" as=\"ch\">\n      <div style=\"min-width: 0\">\n        <div style=\"font-weight: 600\">{{ch.title}}<\/div>\n        <div style=\"font-size: 12px; color: #8A94A8; margin-top: 2px\">{{ch.sub}}<\/div>\n        <div style=\"display: flex; gap: 8px; margin-top: 10px\">\n          <div style=\"width: 34px; height: 150px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7D8799; text-align: right\"><span>{{ch.top}}<\/span><span>{{ch.mid}}<\/span><span>{{ch.bottom}}<\/span><\/div>\n          <div style=\"flex: 1; min-width: 0\">\n            <svg viewBox=\"0 0 600 150\" preserveAspectRatio=\"none\" width=\"100%\" height=\"150\" role=\"img\" aria-label=\"{{ch.aria}}\" style=\"display: block; background: #0B0E14; border-radius: 6px\">\n              <line x1=\"0\" y1=\"{{ch.refY}}\" x2=\"600\" y2=\"{{ch.refY}}\" stroke=\"#3A4458\" stroke-dasharray=\"4 4\" vector-effect=\"non-scaling-stroke\"><\/line>\n              <polyline points=\"{{ch.p0}}\" fill=\"none\" stroke=\"#8A94A8\" stroke-width=\"2.2\" vector-effect=\"non-scaling-stroke\"><\/polyline>\n              <polyline points=\"{{ch.p1}}\" fill=\"none\" stroke=\"#6E8BFF\" stroke-width=\"2.2\" vector-effect=\"non-scaling-stroke\"><\/polyline>\n              <polyline points=\"{{ch.p2}}\" fill=\"none\" stroke=\"#E9A23B\" stroke-width=\"2.2\" vector-effect=\"non-scaling-stroke\"><\/polyline>\n              <polyline points=\"{{ch.p3}}\" fill=\"none\" stroke=\"#2DD4A7\" stroke-width=\"2.2\" vector-effect=\"non-scaling-stroke\"><\/polyline>\n            <\/svg>\n            <div style=\"display: flex; justify-content: space-between; margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7D8799\"><span>0<\/span><span>{{ch.refLabel}}<\/span><span>150<\/span><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n<\/section>\n\n<section aria-label=\"Ranking\" style=\"margin-top: 20px; background: #121722; border: 1px solid {{rankBorder}}; border-radius: 16px; padding: 20px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px\">\n    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8\">{{rankTitle}}<\/span>\n    <span style=\"font-size: 12px; color: #8A94A8\">Ranked by tenants online, then by jobs served<\/span>\n  <\/div>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-top: 16px\">\n    <sc-for list=\"{{podium}}\" as=\"pd\">\n      <div style=\"flex: 1 1 200px; min-width: 0\">\n        <div style=\"text-align: center; font-size: 13px; font-weight: 600; margin-bottom: 6px\">{{pd.label}}<\/div>\n        <div style=\"height: {{pd.h}}px; border-radius: 10px 10px 0 0; background: {{pd.bg}}; border: 1px solid {{pd.color}}; border-bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px\">\n          <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; color: {{pd.color}}\">#{{pd.rank}}<\/span>\n          <span style=\"font-size: 12px; color: #D4D9E3\">{{pd.line}}<\/span>\n        <\/div>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n  <div style=\"height: 2px; background: #2A3242\"><\/div>\n  <p style=\"margin: 16px 0 0; font-size: 16px; line-height: 1.55; color: #E6EAF2\">{{takeaway}}<\/p>\n  <p style=\"margin: 6px 0 0; font-size: 13px; color: #8A94A8\">One seed is one story. Press “New map” to try a different world, then use the <a href=\"#/lab\">Experiment Lab<\/a> to average hundreds of seeds with confidence intervals.<\/p>\n<\/section>\n\n<\/div>\n<\/div>\n","style":"\nhtml{color-scheme:dark}\nbody{margin:0;background:#0B0E14}\n*{scrollbar-width:thin;scrollbar-color:#2A3242 transparent}\na{color:#AEB6C6}a:hover{color:#E6EAF2}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:.4}\nbutton:focus-visible,a:focus-visible{outline:2px solid #6E8BFF;outline-offset:2px}\n","script":"\nclass Component extends Screen {\n  eng() {\n    return this._E || (this._E = makeEngine());\n  }\n  lanesDef() {\n    return [\n      { k: 'none', label: 'No rules', tag: 'BASELINE', desc: 'Tenants forget every encounter; zones are a free-for-all.', regs: { memory: false }, color: '#8A94A8' },\n      { k: 'rep', label: 'Memory + reputation', tag: 'FIXES CHEATING', desc: 'Tenants remember cheaters and check a public trust score.', regs: { memory: true, ledger: true }, color: '#6E8BFF' },\n      { k: 'quota', label: 'Commons quotas', tag: 'FIXES DRAINING', desc: 'Max 3 units per take; nobody drains a zone below 40%.', regs: { memory: false, quotas: true }, color: '#E9A23B' },\n      { k: 'audit', label: 'Random audits', tag: 'FIXES BOTH', desc: 'Cheats and over-drains caught 40% of the time: fine + repayment.', regs: { memory: false, audits: true }, color: '#2DD4A7' }\n    ];\n  }\n  cfg() {\n    const s = this.state || {};\n    return { playing: !!s.playing, speed: s.speed || 2, scarcity: s.scarcity || 'shortage', seed: s.seed || 166 };\n  }\n  ensure() {\n    const c = this.cfg();\n    const key = c.seed + '|' + c.scarcity;\n    if (!this.sims || this.simKey !== key) {\n      const E = this.eng();\n      this.sims = this.lanesDef().map(l => E.create({ seed: c.seed, scarcity: c.scarcity, regs: l.regs }));\n      this.simKey = key;\n    }\n    return this.sims;\n  }\n  stepAll() { const E = this.eng(); this.sims.forEach(S => { if (S.tick < 150) E.step(S); }); }\n  componentDidMount() { this.loop(); }\n  componentWillUnmount() { this.dead = true; clearTimeout(this.timer); }\n  loop() {\n    if (this.dead) return;\n    const c = this.cfg();\n    if (c.playing && this.sims) {\n      if (this.sims[0].tick >= 150) this.setState({ playing: false });\n      else { this.stepAll(); this.forceUpdate(); }\n    }\n    const delay = c.speed === 4 ? 40 : c.speed === 2 ? 120 : 300;\n    this.timer = setTimeout(() => this.loop(), delay);\n  }\n  renderVals() {\n    const E = this.eng();\n    const sims = this.ensure();\n    const c = this.cfg();\n    const set = p => this.setState(p);\n    const ST = E.STRATS;\n    const defs = this.lanesDef();\n    const ZC = { compute: 'rgba(233,162,59,', bw: 'rgba(56,189,248,', power: 'rgba(155,225,93,' };\n    const tick = sims[0].tick;\n    const over = tick >= 150;\n\n    const sums = sims.map(S => E.summary(S));\n    const order = sums.map((s, i) => i).sort((a, b) => (sums[b].online - sums[a].online) || (sums[b].served - sums[a].served));\n    const rankOf = {}; order.forEach((i, r) => { rankOf[i] = r + 1; });\n\n    const lanes = defs.map((d, i) => {\n      const S = sims[i], sm = sums[i];\n      const adv = Math.round(sm.cheatAdv * 100);\n      const hs = 0.5 * sm.online / 10 + 0.5 * Math.min(1, sm.reserve / 0.6);\n      const hc = hs >= 0.8 ? ['Healthy', '#2DD4A7', 'rgba(45,212,167,0.12)'] : hs >= 0.55 ? ['Strained', '#F2B862', 'rgba(233,162,59,0.12)'] : ['Collapsing', '#FF8A6B', 'rgba(255,107,74,0.12)'];\n      const rank = rankOf[i];\n      const dead = S.agents.filter(a => !a.online).map(a => ({ id: a.id, color: ST[a.strat].color, title: a.id + ' · the ' + ST[a.strat].short + ' · offline at tick ' + a.diedAt }));\n      return {\n        n: i + 1, label: d.label, tag: d.tag, desc: d.desc, color: d.color,\n        rank: rank, rankBg: rank === 1 && tick > 0 ? d.color : '#0B0E14', rankFg: rank === 1 && tick > 0 ? '#0B0E14' : '#AEB6C6',\n        zones: S.zones.map(z => ({ left: z.x * 14 + 1, top: z.y * 14 + 1, bg: ZC[z.type] + (0.15 + 0.75 * Math.max(0, z.amt) / z.max).toFixed(2) + ')' })),\n        agents: S.agents.map(a => ({ left: a.x * 14 + 1, top: a.y * 14 + 1, bg: a.online ? ST[a.strat].color : '#3A4458' })),\n        mapAria: d.label + ' lane map: ' + sm.online + ' of 10 tenants online',\n        online: sm.online, served: Math.round(sm.served * 100), reserve: Math.round(sm.reserve * 100),\n        reserveColor: sm.reserve >= 0.4 ? '#9BE15D' : '#FF6B4A',\n        cheat: tick === 0 ? '–' : adv > 5 ? 'Yes +' + adv + '%' : adv < -5 ? 'No ' + adv + '%' : 'Even',\n        cheatColor: tick === 0 ? '#AEB6C6' : adv > 5 ? '#FF8A6B' : '#2DD4A7',\n        dead: dead, noneDead: dead.length === 0,\n        health: hc[0], healthColor: hc[1], healthBg: hc[2]\n      };\n    });\n\n    const pts = (arr, min, max) => arr.length ? arr.map((v, i) => ((i + 1) * 4).toFixed(1) + ',' + (146 - (v - min) / (max - min) * 142).toFixed(1)).join(' ') : '0,146';\n    const advSeries = sims.map(S => S.hist.coopTeam.map((ct, i) => Math.max(-100, Math.min(150, (S.hist.selfTeam[i] / Math.max(1, ct) - 1) * 100))));\n    const charts = [\n      { title: 'Tenants online', sub: 'How many of the 10 tenants are still running', top: '10', mid: '5', bottom: '0', refY: 146 - 0.5 * 142, refLabel: 'dashed = half the tenants', aria: 'Tenants online per lane over the season',\n        p0: pts(sims[0].hist.online, 0, 10), p1: pts(sims[1].hist.online, 0, 10), p2: pts(sims[2].hist.online, 0, 10), p3: pts(sims[3].hist.online, 0, 10) },\n      { title: 'Does cheating pay?', sub: 'Selfish tenants’ extra earnings vs cooperative tenants (%)', top: '+150%', mid: '+25%', bottom: '−100%', refY: 146 - (0 + 100) / 250 * 142, refLabel: 'dashed = 0%: cheating breaks even', aria: 'Selfish advantage per lane over the season',\n        p0: pts(advSeries[0], -100, 150), p1: pts(advSeries[1], -100, 150), p2: pts(advSeries[2], -100, 150), p3: pts(advSeries[3], -100, 150) },\n      { title: 'Commons reserves', sub: 'Average capacity left in the zones', top: '100%', mid: '50%', bottom: '0%', refY: 146 - 0.4 * 142, refLabel: 'dashed = 40% safe reserve', aria: 'Average zone reserves per lane over the season',\n        p0: pts(sims[0].hist.reserve, 0, 1), p1: pts(sims[1].hist.reserve, 0, 1), p2: pts(sims[2].hist.reserve, 0, 1), p3: pts(sims[3].hist.reserve, 0, 1) }\n    ];\n\n    const heights = [150, 118, 92, 70];\n    const podium = [order[1], order[0], order[2], order[3]].map(i => {\n      const r = rankOf[i];\n      return { label: defs[i].label, rank: r, color: defs[i].color, h: heights[r - 1], bg: r === 1 ? 'rgba(230,234,242,0.08)' : '#0B0E14', line: sums[i].online + '/10 online · ' + Math.round(sums[i].served * 100) + '% jobs' };\n    });\n    const best = order[0];\n    let takeaway;\n    if (tick === 0) takeaway = 'Press “Start the race”. The ranking updates live as the season plays out.';\n    else {\n      const b = sums[best], n = sums[0];\n      const advB = Math.round(b.cheatAdv * 100), advN = Math.round(n.cheatAdv * 100);\n      takeaway = (over ? 'Result: ' : 'So far: ') + defs[best].label + ' leads with ' + b.online + '/10 tenants online' +\n        (best !== 0 ? ', versus ' + n.online + '/10 with no rules' : '') + '. ' +\n        'With no rules, selfish tenants earn ' + (advN >= 0 ? '+' : '') + advN + '% vs cooperators' +\n        (best !== 0 ? '; under ' + defs[best].label.toLowerCase() + ' that becomes ' + (advB >= 0 ? '+' : '') + advB + '%.' : '.');\n    }\n    const pill = a => ({ bg: a ? '#E6EAF2' : 'transparent', fg: a ? '#0B0E14' : '#AEB6C6' });\n    return {\n      playing: c.playing, paused: !c.playing,\n      playLabel: c.playing ? 'Pause' : over ? 'Season over' : tick === 0 ? 'Start the race' : 'Resume',\n      togglePlay: () => { if (!over) set({ playing: !c.playing }); },\n      stepOnce: () => { if (!this.cfg().playing && !over) { this.stepAll(); this.forceUpdate(); } },\n      jump: () => { while (this.sims[0].tick < 150) this.stepAll(); set({ playing: false }); },\n      stepDisabled: c.playing || over,\n      reset: () => { this.simKey = null; set({ playing: false }); },\n      newSeed: () => set({ seed: c.seed + 1, playing: false }),\n      speeds: [[1, 'Slow'], [2, 'Normal'], [4, 'Fast']].map(v => Object.assign({ label: v[1], active: c.speed === v[0], pick: () => set({ speed: v[0] }) }, pill(c.speed === v[0]))),\n      scarcities: ['abundant', 'normal', 'shortage'].map(k => Object.assign({ label: E.SCARCITY[k].label, active: c.scarcity === k, pick: () => set({ scarcity: k, playing: false }) }, pill(c.scarcity === k))),\n      seed: c.seed, tick: String(tick).padStart(3, '0'), seasonPct: Math.round(tick / 1.5),\n      lanes: lanes, charts: charts, podium: podium, takeaway: takeaway,\n      rankTitle: over ? 'FINAL RANKING · TICK 150' : 'LIVE RANKING · TICK ' + tick,\n      rankBorder: over ? '#E6EAF2' : '#1E2635'\n    };\n  }\n}\n"},"lab":{"title":"NashNet · Experiment Lab","template":"\n<x-head>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap\">\n<style>\nhtml{color-scheme:dark}\nbody{margin:0;background:#0B0E14}\n*{scrollbar-width:thin;scrollbar-color:#2A3242 transparent}\na{color:#AEB6C6}a:hover{color:#E6EAF2}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:progress;opacity:.55}\nbutton:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #6E8BFF;outline-offset:2px}\n<\/style>\n<\/x-head>\n<div style=\"min-height: 100vh; background: #0B0E14; color: #E6EAF2; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px\">\n<div style=\"max-width: 1440px; margin: 0 auto; padding: 0 24px 48px; box-sizing: border-box\">\n\n<header style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding: 18px 0; border-bottom: 1px solid #1E2635\">\n  <div style=\"display: flex; align-items: center; gap: 12px\">\n    <div aria-hidden=\"true\" style=\"width: 36px; height: 36px; border-radius: 10px; background: #E6EAF2; display: flex; align-items: center; justify-content: center\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#0B0E14\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"5\" cy=\"5\" r=\"2.4\"><\/circle><circle cx=\"15\" cy=\"5\" r=\"2.4\"><\/circle><circle cx=\"10\" cy=\"15\" r=\"2.4\"><\/circle><path d=\"M6.4 7.2l2.4 5.6M13.6 7.2l-2.4 5.6M7.6 5h4.8\"><\/path><\/svg>\n    <\/div>\n    <div>\n      <div style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em\">NashNet<\/div>\n      <div style=\"font-size: 12px; color: #8A94A8\">Compute Commons · multi-agent game theory testbed<\/div>\n    <\/div>\n  <\/div>\n  <nav aria-label=\"Views\" style=\"display: flex; flex-wrap: wrap; gap: 4px; background: #121722; border: 1px solid #1E2635; border-radius: 12px; padding: 4px\">\n    <a href=\"#/welcome\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">0 · Welcome<\/a>\n    <a href=\"#/world\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">1 · World<\/a>\n    <a href=\"#/showdown\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">2 · Showdown<\/a>\n    <a href=\"#/lab\" aria-current=\"page\" style=\"padding: 10px 14px; border-radius: 8px; background: #E6EAF2; color: #0B0E14; text-decoration: none; font-weight: 600; font-size: 13px\">3 · Experiment Lab<\/a>\n  <\/nav>\n<\/header>\n\n<div style=\"margin: 22px 0 16px\">\n  <h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em\">Experiment Lab: is the result real, or just one lucky map?<\/h1>\n  <p style=\"margin: 6px 0 0; color: #AEB6C6; max-width: 900px\">One run is a story; many runs are evidence. This page really runs the simulation in your browser: 8 rule sets × 3 supply levels × many seeds, then reports means with 95% confidence intervals.<\/p>\n<\/div>\n\n<section aria-label=\"Batch controls\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px; background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 16px 18px\">\n  <div style=\"min-width: 220px; flex: 0 1 280px\">\n    <div style=\"display: flex; align-items: baseline\"><label for=\"seeds\" style=\"font-weight: 600\">Seeds per condition<\/label><span style=\"margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 15px\">{{seeds}}<\/span><\/div>\n    <input id=\"seeds\" type=\"range\" min=\"10\" max=\"60\" step=\"5\" value=\"{{seeds}}\" onInput=\"{{changeSeeds}}\" disabled=\"{{running}}\" style=\"width: 100%; accent-color: #6E8BFF; margin-top: 6px\">\n    <div style=\"font-size: 11px; color: #8A94A8\">More seeds = narrower confidence intervals<\/div>\n  <\/div>\n  <button type=\"button\" onClick=\"{{run}}\" disabled=\"{{running}}\" style=\"height: 52px; padding: 0 24px; border-radius: 12px; border: 0; background: #E6EAF2; color: #0B0E14; font-weight: 700; font-size: 15px\">{{runLabel}}<\/button>\n  <div style=\"flex: 1 1 320px; min-width: 0\">\n    <div style=\"display: flex; justify-content: space-between; font-size: 12px; color: #AEB6C6\"><span>{{doneRuns}} of {{totalRuns}} simulations finished<\/span><span style=\"font-family: 'JetBrains Mono', monospace\">{{progress}}%<\/span><\/div>\n    <div style=\"height: 8px; margin-top: 6px; border-radius: 4px; background: #1E2635; overflow: hidden\"><div style=\"height: 100%; width: {{progress}}%; background: #2DD4A7\"><\/div><\/div>\n    <div style=\"font-size: 11px; color: #8A94A8; margin-top: 6px\">Each simulation: 10 tenants, 150 ticks. Every rule set uses the same seeds, so they face identical maps (a paired design).<\/div>\n  <\/div>\n<\/section>\n\n<sc-if value=\"{{hasResults}}\">\n<section aria-label=\"Headline result\" style=\"margin-top: 20px; padding: 20px 22px; border-radius: 16px; background: rgba(45,212,167,0.07); border: 1px solid rgba(45,212,167,0.4)\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #2DD4A7\">HEADLINE · {{scName}} SUPPLY · n = {{nShown}} SEEDS EACH<\/div>\n  <div style=\"margin-top: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.3\">{{headline}}<\/div>\n  <div style=\"margin-top: 6px; color: #D4D9E3\">{{headline2}}<\/div>\n<\/section>\n<\/sc-if>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px\">\n  <div role=\"tablist\" aria-label=\"Metric\" style=\"display: flex; flex-wrap: wrap; gap: 2px; background: #121722; border: 1px solid #1E2635; border-radius: 12px; padding: 4px\">\n    <sc-for list=\"{{metrics}}\" as=\"mt\">\n      <button type=\"button\" role=\"tab\" aria-selected=\"{{mt.active}}\" onClick=\"{{mt.pick}}\" style=\"height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: {{mt.bg}}; color: {{mt.fg}}; font-size: 13px; font-weight: 500\">{{mt.label}}<\/button>\n    <\/sc-for>\n  <\/div>\n  <span style=\"font-size: 13px; color: #AEB6C6; margin-left: 8px\">Supply<\/span>\n  <div role=\"group\" aria-label=\"Supply level shown\" style=\"display: flex; gap: 2px; background: #121722; border: 1px solid #1E2635; border-radius: 12px; padding: 4px\">\n    <sc-for list=\"{{scTabs}}\" as=\"sx\">\n      <button type=\"button\" onClick=\"{{sx.pick}}\" aria-pressed=\"{{sx.active}}\" style=\"height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: {{sx.bg}}; color: {{sx.fg}}; font-size: 13px; font-weight: 500\">{{sx.label}}<\/button>\n    <\/sc-for>\n  <\/div>\n<\/div>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; align-items: flex-start\">\n  <section aria-label=\"Results by rule set\" style=\"flex: 999 1 720px; min-width: 0; background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 20px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px\">\n      <span style=\"font-weight: 600; font-size: 16px\">{{chartTitle}}<\/span>\n      <span style=\"font-size: 12px; color: #8A94A8\">{{chartSub}}<\/span>\n    <\/div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 12px; color: #AEB6C6\">\n      <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 7px; height: 7px; border-radius: 50%; background: #AEB6C6; opacity: .6\"><\/span>one seed (one simulated season)<\/span>\n      <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 3px; background: #E6EAF2\"><\/span>mean<\/span>\n      <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 22px; height: 3px; background: #E6EAF2\"><\/span>95% confidence interval<\/span>\n      <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 0; height: 12px; border-left: 2px dashed #8A94A8\"><\/span>“No rules” baseline<\/span>\n    <\/div>\n\n    <div style=\"margin-top: 16px; overflow-x: auto\">\n      <div style=\"min-width: 640px\">\n        <sc-for list=\"{{rows}}\" as=\"rw\">\n          <div style=\"display: flex; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid #1E2635\">\n            <div style=\"width: 190px; flex: none\">\n              <div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: {{rw.color}}\"><\/span><span style=\"font-weight: 600; font-size: 13px\">{{rw.label}}<\/span><\/div>\n              <div style=\"font-size: 11px; color: #8A94A8; margin-left: 18px\">{{rw.family}}<\/div>\n            <\/div>\n            <div style=\"position: relative; flex: 1; height: 40px; border-radius: 6px; background: #0B0E14\">\n              <div aria-hidden=\"true\" style=\"position: absolute; top: 0; bottom: 0; left: {{baseX}}%; border-left: 2px dashed #5C667A\"><\/div>\n              <sc-for list=\"{{rw.dots}}\" as=\"d\">\n                <div style=\"position: absolute; left: calc({{d.x}}% - 3.5px); top: {{d.y}}px; width: 7px; height: 7px; border-radius: 50%; background: {{rw.color}}; opacity: .45\"><\/div>\n              <\/sc-for>\n              <div style=\"position: absolute; top: 18px; left: {{rw.ciL}}%; width: {{rw.ciW}}%; height: 4px; border-radius: 2px; background: #E6EAF2\"><\/div>\n              <div style=\"position: absolute; top: 13px; left: calc({{rw.meanX}}% - 7px); width: 14px; height: 14px; border-radius: 3px; background: #E6EAF2; box-shadow: 0 0 0 2px #0B0E14\"><\/div>\n            <\/div>\n            <div style=\"width: 120px; flex: none; text-align: right\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600\">{{rw.mean}}<\/div>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A94A8\">± {{rw.ci}}<\/div>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"display: flex; gap: 12px; border-top: 1px solid #2A3242; padding-top: 6px\">\n          <div style=\"width: 190px; flex: none\"><\/div>\n          <div style=\"position: relative; flex: 1; height: 16px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7D8799\">\n            <sc-for list=\"{{ticks}}\" as=\"tk\">\n              <span style=\"position: absolute; left: {{tk.x}}%; transform: translateX(-50%)\">{{tk.label}}<\/span>\n            <\/sc-for>\n          <\/div>\n          <div style=\"width: 120px; flex: none\"><\/div>\n        <\/div>\n        <div style=\"text-align: center; font-size: 12px; color: #8A94A8; margin-top: 6px\">{{axisTitle}}<\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section aria-label=\"Supply heatmap\" style=\"flex: 1 1 380px; min-width: 0; background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 20px\">\n    <div style=\"font-weight: 600; font-size: 16px\">Does the rule hold up when supply gets scarce?<\/div>\n    <div style=\"font-size: 12px; color: #8A94A8; margin-top: 2px\">{{heatSub}}<\/div>\n    <div style=\"display: grid; grid-template-columns: 150px repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 14px; font-size: 12px\">\n      <span><\/span>\n      <span style=\"text-align: center; color: #AEB6C6; padding-bottom: 4px\">Abundant<\/span>\n      <span style=\"text-align: center; color: #AEB6C6; padding-bottom: 4px\">Normal<\/span>\n      <span style=\"text-align: center; color: #AEB6C6; padding-bottom: 4px\">Shortage<\/span>\n      <sc-for list=\"{{heat}}\" as=\"hr\">\n        <span style=\"display: flex; align-items: center; gap: 6px; font-size: 12px; padding-right: 4px\"><span style=\"width: 8px; height: 8px; border-radius: 2px; background: {{hr.color}}\"><\/span>{{hr.label}}<\/span>\n        <sc-for list=\"{{hr.cells}}\" as=\"cl\">\n          <span style=\"display: flex; align-items: center; justify-content: center; height: 36px; border-radius: 6px; background: {{cl.bg}}; color: {{cl.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; outline: {{cl.outline}}; outline-offset: -2px\">{{cl.text}}<\/span>\n        <\/sc-for>\n      <\/sc-for>\n    <\/div>\n    <div style=\"display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 11px; color: #8A94A8\">\n      <span>worse<\/span>\n      <span style=\"flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(45,212,167,0.08), rgba(45,212,167,0.9))\"><\/span>\n      <span>better<\/span>\n    <\/div>\n    <div style=\"font-size: 11px; color: #8A94A8; margin-top: 6px\">White outline = the supply level selected on the left.<\/div>\n  <\/section>\n<\/div>\n\n<section aria-label=\"Full results table\" style=\"margin-top: 20px; background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 20px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 10px\">\n    <span style=\"font-weight: 600; font-size: 16px\">All metrics · {{scNameLower}} supply<\/span>\n    <span style=\"font-size: 12px; color: #8A94A8\">mean ± 95% CI over {{nShown}} seeds · best value in each column highlighted<\/span>\n  <\/div>\n  <div style=\"overflow-x: auto\">\n    <table style=\"width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13px\">\n      <thead>\n        <tr style=\"text-align: left; color: #8A94A8\">\n          <th style=\"padding: 10px 8px; font-weight: 500; border-bottom: 1px solid #2A3242\">Rule set<\/th>\n          <th style=\"padding: 10px 8px; font-weight: 500; border-bottom: 1px solid #2A3242; text-align: right\">Tenants online ↑<\/th>\n          <th style=\"padding: 10px 8px; font-weight: 500; border-bottom: 1px solid #2A3242; text-align: right\">Jobs served ↑<\/th>\n          <th style=\"padding: 10px 8px; font-weight: 500; border-bottom: 1px solid #2A3242; text-align: right\">Cheater advantage ↓<\/th>\n          <th style=\"padding: 10px 8px; font-weight: 500; border-bottom: 1px solid #2A3242; text-align: right\">Cooperation ↑<\/th>\n          <th style=\"padding: 10px 8px; font-weight: 500; border-bottom: 1px solid #2A3242; text-align: right\">Inequality (Gini) ↓<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <sc-for list=\"{{table}}\" as=\"tr\">\n          <tr>\n            <td style=\"padding: 10px 8px; border-bottom: 1px solid #1E2635\"><span style=\"display: inline-flex; align-items: center; gap: 8px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: {{tr.color}}\"><\/span>{{tr.label}}<\/span><\/td>\n            <sc-for list=\"{{tr.cells}}\" as=\"td\">\n              <td style=\"padding: 10px 8px; border-bottom: 1px solid #1E2635; text-align: right; font-family: 'JetBrains Mono', monospace; color: {{td.fg}}; font-weight: {{td.weight}}\">{{td.text}}<\/td>\n            <\/sc-for>\n          <\/tr>\n        <\/sc-for>\n      <\/tbody>\n    <\/table>\n  <\/div>\n  <p style=\"margin: 14px 0 0; font-size: 12px; color: #8A94A8; line-height: 1.5\">Method: each seed generates one map and one season of 150 ticks with 10 tenants (2 Mirrors, 2 Givers, 2 Traders, 1 Checker, 2 Hoarders, 1 Grabber). Rule sets share seeds 1…n. 95% CI = mean ± 1.96 · SD / √n. Cheater advantage = selfish tenants’ average credits ÷ cooperative tenants’ average credits − 1.<\/p>\n<\/section>\n\n<\/div>\n<\/div>\n","style":"\nhtml{color-scheme:dark}\nbody{margin:0;background:#0B0E14}\n*{scrollbar-width:thin;scrollbar-color:#2A3242 transparent}\na{color:#AEB6C6}a:hover{color:#E6EAF2}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:progress;opacity:.55}\nbutton:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #6E8BFF;outline-offset:2px}\n","script":"\nclass Component extends Screen {\n  eng() {\n    return this._E || (this._E = makeEngine());\n  }\n  conds() {\n    return [\n      { k: 'none', label: 'No rules', family: 'baseline', regs: { memory: false }, color: '#8A94A8' },\n      { k: 'memory', label: 'Memory only', family: 'targets cheating', regs: { memory: true }, color: '#9DB0FF' },\n      { k: 'rep', label: 'Memory + reputation', family: 'targets cheating', regs: { memory: true, ledger: true }, color: '#6E8BFF' },\n      { k: 'quota', label: 'Commons quotas', family: 'targets draining', regs: { memory: false, quotas: true }, color: '#E9A23B' },\n      { k: 'pricing', label: 'Congestion pricing', family: 'targets draining', regs: { memory: false, pricing: true }, color: '#C98A2E' },\n      { k: 'audit', label: 'Random audits', family: 'targets both', regs: { memory: false, audits: true }, color: '#2DD4A7' },\n      { k: 'repaudit', label: 'Reputation + audits', family: 'combination', regs: { memory: true, ledger: true, audits: true }, color: '#1FA383' },\n      { k: 'all', label: 'Everything on', family: 'combination', regs: { memory: true, ledger: true, audits: true, quotas: true, pricing: true }, color: '#E6EAF2' }\n    ];\n  }\n  one(seed, sc, regs) {\n    var m = this.eng().run({ seed: seed, scarcity: sc, regs: regs });\n    return { online: m.survival * 100, served: m.served * 100, cheat: m.cheatAdv * 100, coop: m.coop * 100, gini: m.gini };\n  }\n  componentDidMount() { this.startRun(40); }\n  componentWillUnmount() { this.dead = true; clearTimeout(this.timer); }\n  startRun(seeds) {\n    const conds = this.conds();\n    const SCS = ['abundant', 'normal', 'shortage'];\n    const queue = [];\n    SCS.forEach(sc => conds.forEach(c => { for (let s = 1; s <= seeds; s++) queue.push([sc, c.k, c.regs, s]); }));\n    this.res = {}; SCS.forEach(sc => { this.res[sc] = {}; conds.forEach(c => { this.res[sc][c.k] = []; }); });\n    this.queue = queue; this.total = queue.length; this.done = 0; this.runSeeds = seeds;\n    this.setState({ running: true });\n    clearTimeout(this.timer);\n    const work = () => {\n      if (this.dead) return;\n      const E = this.eng();\n      const t0 = Date.now();\n      while (this.queue.length && Date.now() - t0 < 30) {\n        const q = this.queue.shift();\n        this.res[q[0]][q[1]].push(this.one(q[3], q[0], q[2]));\n        this.done++;\n      }\n      if (this.queue.length) { this.forceUpdate(); this.timer = setTimeout(work, 0); }\n      else { this.setState({ running: false }); }\n    };\n    this.timer = setTimeout(work, 30);\n  }\n  renderVals() {\n    const s = this.state || {};\n    const set = p => this.setState(p);\n    const seeds = s.seeds ?? 40;\n    const running = !!s.running;\n    const metric = s.metric || 'online';\n    const sc = s.sc || 'shortage';\n    const conds = this.conds();\n    const SCN = { abundant: 'Abundant', normal: 'Normal', shortage: 'Shortage' };\n    const MET = {\n      online: { label: 'Tenants online', title: 'Tenants still online after 150 ticks', sub: 'percent of the 10 tenants · higher is better', unit: '%', good: 1, fmt: v => v.toFixed(0) + '%', ci: v => v.toFixed(1), axis: 'Tenants online at the end of the season (%)' },\n      served: { label: 'Jobs served', title: 'Share of AI jobs that got computed', sub: 'percent of incoming demand · higher is better', unit: '%', good: 1, fmt: v => v.toFixed(1) + '%', ci: v => v.toFixed(1), axis: 'Jobs served (%)' },\n      cheat: { label: 'Does cheating pay?', title: 'Cheater advantage', sub: 'selfish earnings vs cooperative earnings · lower is better, below 0% means cheating loses', unit: '%', good: -1, fmt: v => (v >= 0 ? '+' : '') + v.toFixed(0) + '%', ci: v => v.toFixed(1), axis: 'Selfish tenants’ extra earnings over cooperative tenants (%)' },\n      coop: { label: 'Cooperation', title: 'Cooperation rate in encounters', sub: 'share of encounter moves that were “share” · context metric', unit: '%', good: 1, fmt: v => v.toFixed(0) + '%', ci: v => v.toFixed(1), axis: 'Cooperative moves (%)' },\n      gini: { label: 'Inequality', title: 'Inequality of final credits', sub: 'Gini coefficient, 0 = perfectly equal · lower is better', unit: '', good: -1, fmt: v => v.toFixed(2), ci: v => v.toFixed(3), axis: 'Gini coefficient of credits' }\n    };\n    const m = MET[metric];\n    const R = this.res || {};\n    const stats = arr => {\n      const n = arr.length; if (!n) return { mean: 0, ci: 0, n: 0 };\n      const mean = arr.reduce((p, q) => p + q, 0) / n;\n      const sd = n > 1 ? Math.sqrt(arr.reduce((p, q) => p + (q - mean) * (q - mean), 0) / (n - 1)) : 0;\n      return { mean: mean, ci: 1.96 * sd / Math.sqrt(n), n: n };\n    };\n    const vals = (scx, k, mk) => ((R[scx] || {})[k] || []).map(o => o[mk]);\n    const hasResults = !!(R[sc] && R[sc].none && R[sc].none.length && !running);\n\n    const allVals = [];\n    conds.forEach(cd => vals(sc, cd.k, metric).forEach(v => allVals.push(v)));\n    let lo = allVals.length ? Math.min.apply(null, allVals) : 0, hi = allVals.length ? Math.max.apply(null, allVals) : 100;\n    if (metric === 'online' || metric === 'coop') { lo = Math.min(lo, 0); hi = 100; }\n    if (metric === 'served') { hi = 100; lo = Math.max(0, Math.floor(lo / 5) * 5 - 5); }\n    if (metric === 'cheat') { lo = Math.floor(Math.min(lo, -10) / 25) * 25; hi = Math.ceil(Math.max(hi, 10) / 25) * 25; }\n    if (metric === 'gini') { lo = 0; hi = Math.max(0.1, Math.ceil(hi * 10) / 10); }\n    const X = v => Math.max(0, Math.min(100, 100 * (v - lo) / (hi - lo || 1)));\n\n    const st = {}; conds.forEach(cd => { st[cd.k] = stats(vals(sc, cd.k, metric)); });\n    const sorted = conds.slice().sort((a, b) => m.good * (st[b.k].mean - st[a.k].mean));\n    const rows = sorted.map(cd => {\n      const v = vals(sc, cd.k, metric); const q = st[cd.k];\n      return {\n        label: cd.label, family: cd.family, color: cd.color,\n        dots: v.map((x, i) => ({ x: X(x).toFixed(2), y: 4 + ((i * 37) % 9) * 3.6 })),\n        meanX: X(q.mean).toFixed(2), ciL: X(q.mean - q.ci).toFixed(2), ciW: Math.max(0.5, X(q.mean + q.ci) - X(q.mean - q.ci)).toFixed(2),\n        mean: q.n ? m.fmt(q.mean) : '–', ci: q.n ? m.ci(q.ci) : '–'\n      };\n    });\n    const ticks = [];\n    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; ticks.push({ x: (i * 25), label: metric === 'gini' ? v.toFixed(2) : (metric === 'cheat' && v > 0 ? '+' : '') + Math.round(v) + m.unit }); }\n\n    const best = sorted[0];\n    const base = st.none, bestS = st[best.k];\n    const surv = k => stats(vals(sc, k, 'online'));\n    const cheat = k => stats(vals(sc, k, 'cheat'));\n    const bestSurvK = conds.slice().sort((a, b) => surv(b.k).mean - surv(a.k).mean)[0];\n    const bs = surv(bestSurvK.k), ns = surv('none');\n    const clear = bs.mean - bs.ci > ns.mean + ns.ci;\n    const headline = hasResults ? bestSurvK.label + ' keeps ' + bs.mean.toFixed(0) + '% of tenants online, versus ' + ns.mean.toFixed(0) + '% with no rules (' + (bs.mean - ns.mean >= 0 ? '+' : '') + (bs.mean - ns.mean).toFixed(0) + ' points).' : 'Running simulations…';\n    const cb = cheat(bestSurvK.k), cn = cheat('none');\n    const headline2 = hasResults ? (clear ? 'The 95% confidence intervals do not overlap, so this difference is very unlikely to be luck. ' : 'The confidence intervals overlap, so treat this difference as uncertain; add more seeds. ') + 'Cheater advantage moves from ' + (cn.mean >= 0 ? '+' : '') + cn.mean.toFixed(0) + '% to ' + (cb.mean >= 0 ? '+' : '') + cb.mean.toFixed(0) + '%.' : '';\n\n    const SCS = ['abundant', 'normal', 'shortage'];\n    const cellMeans = {}; let cmin = Infinity, cmax = -Infinity;\n    conds.forEach(cd => SCS.forEach(x => { const q = stats(vals(x, cd.k, metric)); cellMeans[cd.k + x] = q; if (q.n) { cmin = Math.min(cmin, q.mean); cmax = Math.max(cmax, q.mean); } }));\n    const heat = conds.map(cd => ({\n      label: cd.label, color: cd.color,\n      cells: SCS.map(x => {\n        const q = cellMeans[cd.k + x];\n        let t = q.n && cmax > cmin ? (q.mean - cmin) / (cmax - cmin) : 0;\n        if (m.good < 0) t = 1 - t;\n        return { text: q.n ? m.fmt(q.mean) : '·', bg: 'rgba(45,212,167,' + (0.08 + 0.82 * t).toFixed(2) + ')', fg: t > 0.55 ? '#0B0E14' : '#E6EAF2', outline: x === sc ? '2px solid #E6EAF2' : 'none' };\n      })\n    }));\n\n    const ALLM = ['online', 'served', 'cheat', 'coop', 'gini'];\n    const colBest = {};\n    ALLM.forEach(mk => { let bv = null; conds.forEach(cd => { const q = stats(vals(sc, cd.k, mk)); if (q.n && (bv === null || MET[mk].good * (q.mean - bv) > 0)) bv = q.mean; }); colBest[mk] = bv; });\n    const table = conds.map(cd => ({\n      label: cd.label, color: cd.color,\n      cells: ALLM.map(mk => {\n        const q = stats(vals(sc, cd.k, mk));\n        const isBest = q.n && Math.abs(q.mean - colBest[mk]) < 1e-9;\n        return { text: q.n ? MET[mk].fmt(q.mean) + ' ± ' + MET[mk].ci(q.ci) : '–', fg: isBest ? '#2DD4A7' : '#E6EAF2', weight: isBest ? 700 : 400 };\n      })\n    }));\n\n    const pill = a => ({ bg: a ? '#E6EAF2' : 'transparent', fg: a ? '#0B0E14' : '#AEB6C6' });\n    const total = this.total || 0, done = this.done || 0;\n    return {\n      seeds: seeds, running: running, changeSeeds: e => set({ seeds: parseInt(e.target.value, 10) }),\n      run: () => { if (!running) this.startRun(seeds); },\n      runLabel: running ? 'Running…' : 'Run the experiment',\n      totalRuns: total, doneRuns: done, progress: total ? Math.round(100 * done / total) : 0,\n      hasResults: hasResults, headline: headline, headline2: headline2,\n      scName: SCN[sc].toUpperCase(), scNameLower: SCN[sc], nShown: st.none.n,\n      metrics: Object.keys(MET).map(k => Object.assign({ label: MET[k].label, active: metric === k, pick: () => set({ metric: k }) }, pill(metric === k))),\n      scTabs: SCS.map(k => Object.assign({ label: SCN[k], active: sc === k, pick: () => set({ sc: k }) }, pill(sc === k))),\n      chartTitle: m.title, chartSub: m.sub, axisTitle: m.axis,\n      rows: rows, ticks: ticks, baseX: X(base.mean).toFixed(2),\n      heat: heat, heatSub: m.label + ' by rule set and supply level (mean over seeds)',\n      table: table\n    };\n  }\n}\n"}};
</script>
<script>
/*
 * NashNet UI runtime
 * ------------------
 * A tiny renderer for our screen templates:
 *   {{path}}            value lookup (dotted path into renderVals())
 *   <sc-for list as>    repeat children for each element of a list
 *   <sc-if value>       render children only when value is truthy
 *   onClick / onInput   event handlers returned by renderVals()
 * Each screen defines `class Component extends Screen` with renderVals(), setState(),
 * forceUpdate() and React-style mount/unmount hooks. Rendering goes through a small
 * index-based virtual DOM diff so inputs keep focus and CSS transitions keep working.
 * Screens are switched by URL hash: #/welcome, #/world, #/showdown, #/lab.
 */
(function () {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var VOID = { area: 1, base: 1, br: 1, col: 1, embed: 1, hr: 1, img: 1, input: 1, link: 1, meta: 1, source: 1, track: 1, wbr: 1 };

  var decoder = document.createElement('textarea');
  function decode(s) {
    if (s.indexOf('&') < 0) return s;
    decoder.innerHTML = s;
    return decoder.value;
  }

  /* ---------- template parsing ---------- */
  function parse(src) {
    var root = { tag: '#root', attrs: [], children: [] };
    var stack = [root];
    var i = 0, n = src.length;
    var isSpace = function (c) { return c === ' ' || c === '\n' || c === '\t' || c === '\r' || c === '\f'; };
    while (i < n) {
      if (src.startsWith('<!--', i)) {
        var ce = src.indexOf('-->', i);
        i = ce < 0 ? n : ce + 3;
        continue;
      }
      if (src[i] === '<' && src[i + 1] === '/') {
        var ge = src.indexOf('>', i);
        var ctag = src.slice(i + 2, ge).trim();
        for (var k = stack.length - 1; k > 0; k--) {
          if (stack[k].tag === ctag) { stack.length = k; break; }
        }
        i = ge + 1;
        continue;
      }
      if (src[i] === '<' && /[A-Za-z]/.test(src[i + 1] || '')) {
        var j = i + 1;
        while (j < n && !isSpace(src[j]) && src[j] !== '>' && src[j] !== '/') j++;
        var tag = src.slice(i + 1, j);
        var attrs = [];
        var selfClose = false;
        while (j < n) {
          while (j < n && isSpace(src[j])) j++;
          if (src[j] === '>') { j++; break; }
          if (src[j] === '/' && src[j + 1] === '>') { j += 2; selfClose = true; break; }
          var s0 = j;
          while (j < n && !isSpace(src[j]) && src[j] !== '=' && src[j] !== '>' && !(src[j] === '/' && src[j + 1] === '>')) j++;
          var name = src.slice(s0, j);
          var value = '';
          var save = j;
          while (j < n && isSpace(src[j])) j++;
          if (src[j] === '=') {
            j++;
            while (j < n && isSpace(src[j])) j++;
            var q = src[j];
            if (q === '"' || q === "'") {
              var qe = src.indexOf(q, j + 1);
              value = src.slice(j + 1, qe);
              j = qe + 1;
            } else {
              var ue = j;
              while (ue < n && !isSpace(src[ue]) && src[ue] !== '>') ue++;
              value = src.slice(j, ue);
              j = ue;
            }
          } else {
            j = save;
          }
          if (name) attrs.push([name, decode(value)]);
          else j++;
        }
        var node = { tag: tag, attrs: attrs, children: [] };
        stack[stack.length - 1].children.push(node);
        var lower = tag.toLowerCase();
        if (lower === 'style' || lower === 'script') {
          var re = src.indexOf('</' + tag, j);
          node.raw = src.slice(j, re);
          i = src.indexOf('>', re) + 1;
          continue;
        }
        if (!VOID[lower] && !selfClose) stack.push(node);
        i = j;
        continue;
      }
      var te = src.indexOf('<', i + 1);
      if (te < 0) te = n;
      var text = src.slice(i, te);
      if (!(/^\s*$/.test(text) && text.indexOf('\n') >= 0)) {
        stack[stack.length - 1].children.push({ text: decode(text) });
      }
      i = te;
    }
    return root;
  }

  /* ---------- holes ---------- */
  var SINGLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function prep(str) {
    var m = str.match(SINGLE);
    if (m) return { single: m[1] };
    if (str.indexOf('{{') < 0) return { stat: str };
    var parts = [], last = 0, mm;
    HOLE.lastIndex = 0;
    while ((mm = HOLE.exec(str))) {
      if (mm.index > last) parts.push(str.slice(last, mm.index));
      parts.push({ e: mm[1] });
      last = mm.index + mm[0].length;
    }
    if (last < str.length) parts.push(str.slice(last));
    return { parts: parts };
  }
  function lookup(scope, expr) {
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (expr === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return +expr;
    if (/^(['"]).*\1$/.test(expr)) return expr.slice(1, -1);
    var segs = expr.split('.');
    var v = scope[segs[0]];
    for (var i = 1; i < segs.length; i++) {
      if (v == null) return undefined;
      v = v[segs[i]];
    }
    return v;
  }
  function evalRaw(tp, scope) {
    if (!tp) return undefined;
    if (tp.single !== undefined) return lookup(scope, tp.single);
    return evalStr(tp, scope);
  }
  function evalStr(tp, scope) {
    if (tp.stat !== undefined) return tp.stat;
    if (tp.single !== undefined) { var v = lookup(scope, tp.single); return v == null ? '' : String(v); }
    var out = '';
    for (var i = 0; i < tp.parts.length; i++) {
      var p = tp.parts[i];
      if (typeof p === 'string') out += p;
      else { var x = lookup(scope, p.e); out += x == null ? '' : String(x); }
    }
    return out;
  }
  function compile(node) {
    if (node.text !== undefined) { node.tp = prep(node.text); return; }
    node.cattrs = node.attrs.filter(function (a) { return a[0].indexOf('hint-') !== 0; }).map(function (a) { return [a[0], prep(a[1])]; });
    node.amap = {};
    node.cattrs.forEach(function (a) { node.amap[a[0]] = a[1]; });
    (node.children || []).forEach(compile);
  }

  /* ---------- render to virtual nodes ---------- */
  function renderNodes(nodes, scope, out, ns) {
    for (var i = 0; i < nodes.length; i++) {
      var nd = nodes[i];
      if (nd.text !== undefined) {
        var s = evalStr(nd.tp, scope);
        if (s !== '') out.push({ t: s });
        continue;
      }
      if (nd.tag === 'x-head' || nd.tag === 'style' || nd.tag === 'script' || nd.tag === 'link') continue;
      if (nd.tag === 'sc-for') {
        var list = evalRaw(nd.amap.list, scope) || [];
        var as = nd.amap.as ? evalStr(nd.amap.as, scope) : 'item';
        for (var li = 0; li < list.length; li++) {
          var sc = Object.create(scope);
          sc[as] = list[li];
          sc.$index = li;
          renderNodes(nd.children, sc, out, ns);
        }
        continue;
      }
      if (nd.tag === 'sc-if') {
        if (evalRaw(nd.amap.value, scope)) renderNodes(nd.children, scope, out, ns);
        continue;
      }
      var cns = nd.tag === 'svg' ? SVGNS : ns;
      var v = { tag: nd.tag, ns: cns, attrs: {}, ev: {}, props: {}, ch: [] };
      for (var a = 0; a < nd.cattrs.length; a++) {
        var name = nd.cattrs[a][0], tp = nd.cattrs[a][1];
        if (/^on[A-Z]/.test(name)) { v.ev[name.slice(2).toLowerCase()] = evalRaw(tp, scope); continue; }
        var val = tp.single !== undefined ? lookup(scope, tp.single) : evalStr(tp, scope);
        if (name === 'disabled' || name === 'checked') { v.props[name] = val === '' ? true : !!val; continue; }
        if (name === 'value' && (nd.tag === 'input' || nd.tag === 'select' || nd.tag === 'textarea')) { v.props.value = val == null ? '' : String(val); continue; }
        if (val === undefined || val === null || typeof val === 'function') continue;
        v.attrs[name] = String(val);
      }
      renderNodes(nd.children, scope, v.ch, cns);
      out.push(v);
    }
  }

  /* ---------- patch real DOM ---------- */
  function setEv(el, type, fn) {
    if (!el._ev) el._ev = {};
    if (!(type in el._ev)) {
      el.addEventListener(type, function (e) {
        var f = el._ev[type];
        if (typeof f === 'function') f(e);
      });
    }
    el._ev[type] = fn;
  }
  function create(v) {
    if (v.t !== undefined) { var tn = document.createTextNode(v.t); tn._v = v; return tn; }
    var el = v.ns ? document.createElementNS(v.ns, v.tag) : document.createElement(v.tag);
    for (var k in v.attrs) el.setAttribute(k, v.attrs[k]);
    for (var e in v.ev) setEv(el, e, v.ev[e]);
    el._kids = [];
    for (var i = 0; i < v.ch.length; i++) { var c = create(v.ch[i]); el.appendChild(c); el._kids.push(c); }
    for (var p in v.props) el[p] = v.props[p];
    el._v = v;
    return el;
  }
  function patch(el, nv) {
    var ov = el._v;
    if (nv.t !== undefined || ov.t !== undefined) {
      if (nv.t !== undefined && ov.t !== undefined) {
        if (ov.t !== nv.t) el.nodeValue = nv.t;
        el._v = nv;
        return el;
      }
      var r = create(nv); el.parentNode.replaceChild(r, el); return r;
    }
    if (ov.tag !== nv.tag || ov.ns !== nv.ns) {
      var r2 = create(nv); el.parentNode.replaceChild(r2, el); return r2;
    }
    var k;
    for (k in nv.attrs) if (ov.attrs[k] !== nv.attrs[k]) el.setAttribute(k, nv.attrs[k]);
    for (k in ov.attrs) if (!(k in nv.attrs)) el.removeAttribute(k);
    for (k in nv.ev) setEv(el, k, nv.ev[k]);
    for (k in ov.ev) if (!(k in nv.ev)) el._ev[k] = null;
    patchChildren(el, nv.ch);
    for (k in nv.props) if (el[k] !== nv.props[k]) el[k] = nv.props[k];
    el._v = nv;
    return el;
  }
  function patchChildren(parent, newCh) {
    var kids = parent._kids || (parent._kids = []);
    var i;
    for (i = 0; i < newCh.length; i++) {
      if (i < kids.length) kids[i] = patch(kids[i], newCh[i]);
      else { var c = create(newCh[i]); parent.appendChild(c); kids.push(c); }
    }
    for (var j = kids.length - 1; j >= newCh.length; j--) { parent.removeChild(kids[j]); kids.pop(); }
  }

  /* ---------- component base class ---------- */
  function Screen(props) { this.props = props || {}; this.state = undefined; }
  Screen.prototype.setState = function (p) {
    var upd = typeof p === 'function' ? p(this.state || {}, this.props) : p;
    this.state = Object.assign({}, this.state || {}, upd || {});
    if (this._schedule) this._schedule();
  };
  Screen.prototype.forceUpdate = function () { if (this._schedule) this._schedule(); };

  /* ---------- screens & routing ---------- */
  var app = document.getElementById('app');
  var styleEl = document.getElementById('screen-style');
  var current = null;

  function showError(err) {
    console.error(err);
    var box = document.getElementById('nn-error');
    if (!box) {
      box = document.createElement('div');
      box.id = 'nn-error';
      box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:99;padding:14px 16px;border-radius:12px;background:#3a1410;color:#ffd9cf;font:13px/1.5 monospace;white-space:pre-wrap;border:1px solid #ff6b4a';
      document.body.appendChild(box);
    }
    box.textContent = 'Something went wrong on this screen: ' + (err && err.message ? err.message : err) + '\nTry reloading the page.';
  }

  function prepareScreen(S) {
    if (S.ast) return;
    S.ast = parse(S.template);
    compile(S.ast);
    S.Comp = new Function('Screen', 'makeEngine', S.script + '\n;return Component;')(Screen, window.makeEngine);
  }

  function mount(route) {
    var S = window.NASHNET_SCREENS[route] || window.NASHNET_SCREENS.welcome;
    if (current) {
      try { if (current.inst.componentWillUnmount) current.inst.componentWillUnmount(); } catch (e) { console.error(e); }
      current.inst._dead = true;
    }
    var old = document.getElementById('nn-error'); if (old) old.remove();
    try { prepareScreen(S); } catch (e) { showError(e); return; }
    styleEl.textContent = S.style;
    document.title = S.title;
    app.innerHTML = '';
    var host = document.createElement('div');
    host._kids = [];
    app.appendChild(host);
    var inst = new S.Comp({});
    var pending = false;
    function render() {
      var vals;
      try { vals = inst.renderVals(); } catch (e) { showError(e); return; }
      var out = [];
      try { renderNodes(S.ast.children, vals, out, null); patchChildren(host, out); } catch (e2) { showError(e2); }
    }
    inst._schedule = function () {
      if (pending || inst._dead) return;
      pending = true;
      requestAnimationFrame(function () { pending = false; if (!inst._dead) render(); });
    };
    current = { inst: inst, route: route };
    render();
    window.scrollTo(0, 0);
    try { if (inst.componentDidMount) inst.componentDidMount(); } catch (e) { showError(e); }
  }

  function routeFromHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    return window.NASHNET_SCREENS[h] ? h : 'welcome';
  }
  window.addEventListener('hashchange', function () { mount(routeFromHash()); });
  mount(routeFromHash());
})();

</script>
</body>
