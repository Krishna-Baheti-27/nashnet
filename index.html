<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">

<body>
<div id="app"><div style="padding:48px;font-family:system-ui,sans-serif;color:#AEB6C6">Loading NashNet…</div></div>
<noscript><div style="padding:48px;font-family:system-ui,sans-serif;color:#E6EAF2">NashNet needs JavaScript. Please enable it and reload.</div></noscript>
<script>
/*
 * NashNet simulation engine
 * -------------------------
 * Agent-based model of N autonomous tenants sharing a renewable,
 * multi-resource compute commons (GPU, bandwidth, power) on a grid.
 * Each tick: tenants serve one job, extract from capacity zones, meet
 * neighbours and play a donation game; platform mechanisms (memory,
 * reputation ledger, quotas, congestion pricing, audits) modify payoffs.
 *
 * Everything is driven by one seeded PRNG, so (seed, config) -> identical run.
 * Works in Node (module.exports) and in the browser (window.makeEngine).
 */
(function (root) {
  'use strict';

  var DEFAULTS = {
    gridSize: 20,          // G: the world is a G x G grid
    zonesPerType: 8,       // Z: capacity zones per resource type
    jobCost: 0.3,          // kappa: units of EACH resource consumed per job
    jobCredits: 2,         // credits earned per served job
    idlePower: 0.05,       // power drawn every tick by an online tenant
    movePower: 0.05,       // power cost of moving one cell
    slaGain: 3,            // SLA increase on a served job (capped at 100)
    slaLoss: 7,            // SLA decrease on a missed job
    radius: 3,             // interaction radius (Chebyshev distance)
    meetProb: 0.45,        // probability that an eligible pair actually meets
    noise: 0.03,           // execution error (trembling hand)
    giftCost: 1,           // c: units the giver loses when sharing
    giftBenefit: 3,        // b: units the receiver gains
    fairTake: 3,           // max units per extraction for fair tenants / under quota
    greedyTake: 6,         // max units per extraction for greedy tenants
    reserve: 0.4,          // u_res: safe reserve as a fraction of zone capacity
    desperate: 1,          // hardship threshold: stock below this exempts the reserve rule
    stockCap: 9,           // tenants stop collecting a type above this stock
    auditProb: 0.4,        // p: probability an offence is detected
    auditFine: 4,          // F: credit fine on detection
    auditRestitution: 2,   // rho: units returned to the victim (or zone)
    grabProb: 0.6,         // success probability of a forced grab
    grabAmount: 2,         // units taken by a successful grab
    grabPenalty: 1,        // power wasted by a failed grab
    priceLow: 0.3,         // tau_low: credits per unit when the zone stays above reserve
    priceHigh: 1.5,        // tau_high: credits per unit when the zone ends below reserve
    regenBase: 0.12,       // alpha in g(u) = r (alpha + beta u (1-u))
    regenShape: 3.5,       // beta
    standing: 0.45,        // defecting against a partner with reputation below this is justified
    ledgerRefuse: 0.3,     // ledger-aware strategies refuse partners below this reputation
    traderTrust: 0.45,     // Trader cooperates if private trust >= this
    checkerTrust: 0.5      // Checker cooperates if reputation (or trust) >= this
  };

  var STRATS = {
    TFT: { name: 'Tit-for-Tat', short: 'Mirror', glyph: 'T', color: '#6E8BFF', team: 'coop', extraction: 'fair', ledgerAware: true,
      blurb: 'Nice first, then copies what you did to it last time.' },
    ALLD: { name: 'Always Defect', short: 'Hoarder', glyph: 'D', color: '#FF6B4A', team: 'selfish', extraction: 'greedy', ledgerAware: false,
      blurb: 'Takes what is offered, never gives anything back, and over-drains zones.' },
    ALLC: { name: 'Always Cooperate', short: 'Giver', glyph: 'C', color: '#2DD4A7', team: 'coop', extraction: 'fair', ledgerAware: false,
      blurb: 'Always shares spare capacity, even with cheaters.' },
    TRADER: { name: 'Trader', short: 'Trader', glyph: '$', color: '#C08BFF', team: 'coop', extraction: 'fair', ledgerAware: true,
      blurb: 'Swaps only with partners it trusts at least a little.' },
    AGGR: { name: 'Aggressive', short: 'Grabber', glyph: 'A', color: '#FF4D8D', team: 'selfish', extraction: 'greedy', ledgerAware: false,
      blurb: 'Tries to take other tenants’ capacity by force, and over-drains zones.' },
    REP: { name: 'Reputation-aware', short: 'Checker', glyph: 'R', color: '#E8ECF4', team: 'coop', extraction: 'fair', ledgerAware: true,
      blurb: 'Checks a partner’s reputation before cooperating.' }
  };
  var STRAT_KEYS = ['TFT', 'ALLC', 'TRADER', 'REP', 'ALLD', 'AGGR'];
  var PLAN = ['TFT', 'TFT', 'ALLD', 'ALLD', 'ALLC', 'ALLC', 'TRADER', 'TRADER', 'AGGR', 'REP'];
  var KINDS = ['compute', 'bw', 'power'];
  var LABEL = { compute: 'GPU', bw: 'bandwidth', power: 'power' };
  var SCARCITY = {
    abundant: { max: 14, regen: 0.7, label: 'Abundant' },
    normal: { max: 10, regen: 0.45, label: 'Normal' },
    shortage: { max: 8, regen: 0.3, label: 'Shortage' }
  };
  var RULESETS = {
    none: { label: 'No rules', regs: { memory: false } },
    memory: { label: 'Memory only', regs: { memory: true } },
    rep: { label: 'Memory + reputation', regs: { memory: true, ledger: true } },
    quota: { label: 'Commons quotas', regs: { memory: false, quotas: true } },
    pricing: { label: 'Congestion pricing', regs: { memory: false, pricing: true } },
    audit: { label: 'Random audits', regs: { memory: false, audits: true } },
    repaudit: { label: 'Reputation + audits', regs: { memory: true, ledger: true, audits: true } },
    all: { label: 'Everything on', regs: { memory: true, ledger: true, audits: true, quotas: true, pricing: true } }
  };

  // mulberry32: small, fast, well-distributed 32-bit PRNG
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, r) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function richest(a) { return KINDS.reduce(function (x, k) { return a[k] > a[x] ? k : x; }, 'compute'); }
  function poorest(a) { return KINDS.reduce(function (x, k) { return a[k] < a[x] ? k : x; }, 'compute'); }
  function cheb(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }

  function create(o) {
    o = o || {};
    var P = Object.assign({}, DEFAULTS, o.params || {});
    var seed = o.seed || 42, scarcity = o.scarcity || 'shortage';
    var regs = Object.assign({ memory: true, ledger: false, audits: false, pricing: false, quotas: false }, o.regs || {});
    var plan = o.plan || PLAN;
    var r = rng(seed);
    var sc = SCARCITY[scarcity];
    var G = P.gridSize, used = {};
    function free() {
      var x, y;
      do { x = Math.floor(r() * G); y = Math.floor(r() * G); } while (used[x + ',' + y]);
      used[x + ',' + y] = 1;
      return [x, y];
    }
    var zones = [];
    KINDS.forEach(function (type) {
      for (var i = 0; i < P.zonesPerType; i++) {
        var p = free();
        zones.push({ x: p[0], y: p[1], type: type, amt: sc.max * (0.5 + r() * 0.5), max: sc.max });
      }
    });
    var agents = plan.map(function (s, i) {
      var p = free();
      return { id: 'A' + (i + 1), strat: s, x: p[0], y: p[1], compute: 4 + r() * 5, bw: 4 + r() * 5, power: 5 + r() * 5,
        credits: 10, sla: 100, online: true, mem: {}, last: 'Just arrived', diedAt: null, fines: 0 };
    });
    return {
      P: P, r: r, sc: sc, scarcity: scarcity, regs: regs, zones: zones, agents: agents, tick: 0,
      events: [], links: [], ledger: {}, win: [], served: 0, demand: 0, flash: [], acts: 0, coops: 0,
      encounters: 0, pairs: {}, audits: 0, gifts: 0,
      hist: { online: [], coop: [], served: [], coopTeam: [], selfTeam: [], reserve: [] }
    };
  }

  // Laplace (Beta(1,1)) posterior mean of cooperation probability
  function trustOf(a, id) { var m = a.mem[id]; return m ? (m.c + 1) / (m.c + m.d + 2) : 0.5; }
  function rep(S, id) { var l = S.ledger[id]; return l ? (l.c + 1) / (l.c + l.d + 2) : 0.5; }

  function decide(S, a, b) {
    var P = S.P, reg = S.regs, m = reg.memory ? a.mem[b.id] : null;
    var act = 'C';
    if (a.strat === 'ALLD') act = 'D';
    else if (a.strat === 'TFT') act = m && m.lastThem === 'D' ? 'D' : 'C';
    else if (a.strat === 'TRADER') act = (reg.memory ? trustOf(a, b.id) : 0.5) >= P.traderTrust ? 'C' : 'D';
    else if (a.strat === 'AGGR') act = 'P';
    else if (a.strat === 'REP') act = (reg.ledger ? rep(S, b.id) : (reg.memory ? trustOf(a, b.id) : 0.5)) >= P.checkerTrust ? 'C' : 'D';
    if (reg.ledger && STRATS[a.strat].ledgerAware && rep(S, b.id) < P.ledgerRefuse) act = 'D';
    if (S.r() < P.noise) act = act === 'C' ? 'D' : 'C';
    return act;
  }
  function log(S, e) {
    S.events.unshift(Object.assign({ tick: S.tick }, e));
    if (S.events.length > 40) S.events.pop();
  }
  function fmt(v) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(v % 1 ? 1 : 0); }

  function interact(S, a, b) {
    var P = S.P, r = S.r, reg = S.regs;
    var xa = decide(S, a, b), xb = decide(S, b, a);
    // standing is judged on reputations BEFORE this encounter
    var repA = rep(S, a.id), repB = rep(S, b.id);
    var pay = {}; pay[a.id] = 0; pay[b.id] = 0;
    function give(f, t) {
      var k = richest(f);
      if (f[k] >= P.giftCost) { f[k] -= P.giftCost; t[poorest(t)] += P.giftBenefit; pay[f.id] -= P.giftCost; pay[t.id] += P.giftBenefit; S.gifts++; }
    }
    if (xa === 'C') give(a, b);
    if (xb === 'C') give(b, a);
    var kind, text, story, first = a, second = b;
    if (xa === 'P' || xb === 'P') {
      var ag = xa === 'P' ? a : b, vi = ag === a ? b : a;
      first = ag; second = vi; kind = 'GRAB';
      if (r() < P.grabProb) {
        var k = richest(vi), amt = Math.min(P.grabAmount, vi[k]);
        vi[k] -= amt; ag[k] += amt; pay[ag.id] += amt; pay[vi.id] -= amt;
        text = 'grabbed ' + LABEL[k] + ' by force';
        story = ag.id + ' forcibly took ' + amt.toFixed(1) + ' ' + LABEL[k] + ' from ' + vi.id + '.';
        ag.last = 'Grabbed ' + LABEL[k] + ' from ' + vi.id;
      } else {
        ag.power = Math.max(0, ag.power - P.grabPenalty); pay[ag.id] -= P.grabPenalty;
        text = 'grab failed, wasted power';
        story = ag.id + ' tried to grab from ' + vi.id + ' but failed and wasted power.';
        ag.last = 'Failed grab on ' + vi.id;
      }
      vi.last = 'Targeted by ' + ag.id;
    } else if (xa === 'C' && xb === 'C') {
      var tr = a.strat === 'TRADER' || b.strat === 'TRADER';
      kind = tr ? 'SWAP' : 'SHARE';
      text = tr ? 'swapped spare capacity' : 'shared spare capacity';
      story = a.id + ' and ' + b.id + ' ' + (tr ? 'swapped' : 'shared') + ' spare capacity. Both end up better off (+2 each).';
      a.last = (tr ? 'Swapped with ' : 'Shared with ') + b.id;
      b.last = (tr ? 'Swapped with ' : 'Shared with ') + a.id;
    } else if (xa === 'D' && xb === 'D') {
      kind = 'REFUSE'; text = 'both refused to share';
      story = a.id + ' and ' + b.id + ' both refused to share. Nobody gains.';
      a.last = 'Refused ' + b.id; b.last = 'Refused ' + a.id;
    } else {
      var d = xa === 'D' ? a : b, v = d === a ? b : a;
      first = d; second = v; kind = 'CHEAT';
      text = 'took capacity, gave nothing back';
      story = d.id + ' accepted ' + v.id + '’s capacity and gave nothing back.' + (reg.memory ? ' ' + v.id + ' will remember this.' : ' With memory off, ' + v.id + ' will forget.');
      d.last = 'Cheated ' + v.id; v.last = 'Cheated by ' + d.id;
    }
    if (reg.memory) {
      var rec = function (self, other, act) {
        var m = self.mem[other.id] || (self.mem[other.id] = { c: 0, d: 0, n: 0, lastThem: null });
        if (act === 'C') m.c++; else m.d++;
        m.n++; m.lastThem = act === 'C' ? 'C' : 'D';
      };
      rec(a, b, xb); rec(b, a, xa);
    }
    // public ledger with a standing rule: refusing a partner of bad standing is not held against you
    [[a, xa, repB], [b, xb, repA]].forEach(function (p) {
      var l = S.ledger[p[0].id] || (S.ledger[p[0].id] = { c: 0, d: 0 });
      if (p[1] === 'C') l.c++;
      else if (!(p[1] === 'D' && p[2] < P.standing)) l.d++;
    });
    log(S, { a: first.id, b: second.id, text: text, story: story, kind: kind, pay: fmt(pay[first.id]) + ' / ' + fmt(pay[second.id]) });
    S.flash = S.flash.concat([a.id, b.id]);
    S.links.push({ a: a.id, b: b.id, kind: kind === 'SHARE' || kind === 'SWAP' ? 'coop' : 'defect', ttl: 5 });
    // audits: ANY non-cooperative move (defect or grab) by ANY tenant is an offence, detected with prob p
    if (reg.audits) {
      [[a, xa, b], [b, xb, a]].forEach(function (p) {
        if (p[1] !== 'C' && r() < P.auditProb) {
          var k = richest(p[0]), back = Math.min(P.auditRestitution, p[0][k]);
          p[0][k] -= back; p[2][k] += back; p[0].credits -= P.auditFine; p[0].fines += P.auditFine; S.audits++;
          log(S, { a: p[0].id, b: p[2].id, text: 'audited: fined, partner repaid', story: 'Audit! ' + p[0].id + ' was caught not cooperating with ' + p[2].id + ': fined ' + P.auditFine + ' credits and ' + back.toFixed(1) + ' ' + LABEL[k] + ' was paid to ' + p[2].id + '.', kind: 'AUDIT', pay: '−' + P.auditFine });
        }
      });
    }
    var key = a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id;
    S.pairs[key] = (S.pairs[key] || 0) + 1;
    S.encounters++;
    var cc = (xa === 'C' ? 1 : 0) + (xb === 'C' ? 1 : 0);
    S.acts += 2; S.coops += cc;
    return cc;
  }

  function step(S) {
    var P = S.P, r = S.r, reg = S.regs, G = P.gridSize;
    S.tick++; S.flash = [];
    var tc = 0, ta = 0;
    var live = shuffle(S.agents.filter(function (a) { return a.online; }), r);
    live.forEach(function (a) {
      // 1. serve one job (Leontief: needs kappa of every resource)
      a.power = Math.max(0, a.power - P.idlePower);
      S.demand++;
      if (a.compute >= P.jobCost && a.bw >= P.jobCost && a.power >= P.jobCost) {
        a.compute -= P.jobCost; a.bw -= P.jobCost; a.power -= P.jobCost;
        a.credits += P.jobCredits; a.sla = Math.min(100, a.sla + P.slaGain); S.served++;
      } else a.sla -= P.slaLoss;
      if (a.sla <= 0) {
        a.online = false; a.sla = 0; a.power = Math.max(0, a.power); a.last = 'Went offline'; a.diedAt = S.tick;
        log(S, { a: a.id, b: '', text: 'went offline', story: a.id + ' (' + STRATS[a.strat].name + ') ran out of resources and went offline.', kind: 'OFFLINE', pay: '' });
        return;
      }
      // 2. extraction policy: fair tenants keep the reserve; greedy tenants ignore it unless quotas/pricing apply
      var greedy = STRATS[a.strat].extraction === 'greedy';
      var restrained = !greedy || reg.quotas || reg.pricing;
      var avail = function (z, desperate) { return z.amt - (restrained && !desperate ? P.reserve * z.max : 0); };
      var need = poorest(a);
      var desperate = a[need] < P.desperate;
      var here = null;
      for (var zi = 0; zi < S.zones.length; zi++) {
        var zz = S.zones[zi];
        if (zz.x === a.x && zz.y === a.y && a[zz.type] < P.stockCap && avail(zz, a[zz.type] < P.desperate) >= 0.5) { here = zz; break; }
      }
      var best = here, bd = here ? 0 : 1e9;
      if (!here) {
        S.zones.forEach(function (z) {
          if (z.type === need && avail(z, desperate) >= 1) {
            var d = cheb(z, a);
            if (d < bd) { bd = d; best = z; }
          }
        });
      }
      if (best && bd > 0) {
        a.x += Math.sign(best.x - a.x); a.y += Math.sign(best.y - a.y); a.power = Math.max(0, a.power - P.movePower);
        a.last = 'Moving to a ' + LABEL[need] + ' zone';
      } else if (best) {
        var hard = a[best.type] < P.desperate;
        var cap = reg.quotas ? P.fairTake : (greedy ? P.greedyTake : P.fairTake);
        var take = Math.max(0, Math.min(cap, avail(best, hard)));
        var belowReserve = best.amt - take < P.reserve * best.max;
        best.amt -= take; a[best.type] += take;
        if (reg.pricing) a.credits -= take * (belowReserve ? P.priceHigh : P.priceLow);
        a.last = (greedy && !restrained ? 'Hoarded ' : 'Collected ') + take.toFixed(1) + ' ' + LABEL[best.type];
        // commons rule: do not leave a zone below its reserve unless in hardship; audited for EVERY tenant
        if (reg.audits && belowReserve && !hard && take > 0 && r() < P.auditProb) {
          var back = Math.min(take, a[best.type]);
          a[best.type] -= back; best.amt += back; a.credits -= P.auditFine; a.fines += P.auditFine; S.audits++;
          log(S, { a: a.id, b: '', text: 'audited: over-draining a zone', story: 'Audit! ' + a.id + ' was caught draining a ' + LABEL[best.type] + ' zone below its safe reserve: fined ' + P.auditFine + ' credits and ' + back.toFixed(1) + ' units returned to the zone.', kind: 'AUDIT', pay: '−' + P.auditFine });
        }
      } else {
        a.x = Math.max(0, Math.min(G - 1, a.x + Math.round(r() * 2 - 1)));
        a.y = Math.max(0, Math.min(G - 1, a.y + Math.round(r() * 2 - 1)));
        a.last = 'Searching for ' + LABEL[need];
      }
    });
    // 3. encounters: random greedy matching on the proximity graph (order shuffled every tick)
    var busy = {};
    var on = shuffle(S.agents.filter(function (a) { return a.online; }), r);
    for (var i = 0; i < on.length; i++) {
      for (var j = i + 1; j < on.length; j++) {
        var a = on[i], b = on[j];
        if (busy[a.id] || busy[b.id]) continue;
        if (cheb(a, b) <= P.radius && r() < P.meetProb) {
          busy[a.id] = 1; busy[b.id] = 1;
          tc += interact(S, a, b); ta += 2;
        }
      }
    }
    // 4. renewable regrowth g(u) = r (alpha + beta u (1 - u))
    S.zones.forEach(function (z) {
      var u = Math.max(0, z.amt) / z.max;
      z.amt = Math.min(z.max, z.amt + S.sc.regen * (P.regenBase + P.regenShape * u * (1 - u)));
    });
    S.links = S.links.map(function (l) { return Object.assign({}, l, { ttl: l.ttl - 1 }); }).filter(function (l) { return l.ttl > 0; });
    S.win.push([tc, ta]); if (S.win.length > 10) S.win.shift();
    var wc = S.win.reduce(function (p, w) { return p + w[0]; }, 0), wa = S.win.reduce(function (p, w) { return p + w[1]; }, 0);
    var H = S.hist;
    H.online.push(S.agents.filter(function (a) { return a.online; }).length);
    H.coop.push(wa ? wc / wa : (H.coop.length ? H.coop[H.coop.length - 1] : 0.5));
    H.served.push(S.demand ? S.served / S.demand : 1);
    H.coopTeam.push(teamCredits(S, 'coop')); H.selfTeam.push(teamCredits(S, 'selfish'));
    H.reserve.push(meanReserve(S));
  }
  function teamCredits(S, t) {
    var g = S.agents.filter(function (a) { return STRATS[a.strat].team === t; });
    return g.length ? g.reduce(function (p, a) { return p + a.credits; }, 0) / g.length : 0;
  }
  function meanReserve(S) { return S.zones.reduce(function (p, z) { return p + Math.max(0, z.amt) / z.max; }, 0) / S.zones.length; }
  function gini(xs) {
    var v = xs.map(function (x) { return Math.max(0, x); }).sort(function (p, q) { return p - q; });
    var n = v.length, s = v.reduce(function (p, q) { return p + q; }, 0);
    if (!s) return 0;
    var g = 0; v.forEach(function (x, i) { g += (2 * (i + 1) - n - 1) * x; });
    return g / (n * s);
  }
  function summary(S) {
    var n = S.agents.length;
    var online = S.agents.filter(function (a) { return a.online; }).length;
    var ct = teamCredits(S, 'coop'), st = teamCredits(S, 'selfish');
    var pairsMet = Object.keys(S.pairs).length;
    return {
      online: online,
      survival: online / n,
      served: S.demand ? S.served / S.demand : 1,
      cheatAdv: ct > 0 ? st / ct - 1 : 0,
      coop: S.acts ? S.coops / S.acts : 0,
      gini: gini(S.agents.map(function (a) { return a.credits; })),
      reserve: meanReserve(S),
      encounters: S.encounters,
      pairsMet: pairsMet,
      wHat: S.encounters ? 1 - pairsMet / S.encounters : 0,
      audits: S.audits,
      gifts: S.gifts
    };
  }
  function run(o, ticks) {
    var S = create(o);
    var T = ticks || 150;
    for (var t = 0; t < T; t++) step(S);
    var s = summary(S);
    s.byStrategy = {};
    STRAT_KEYS.forEach(function (k) {
      var g = S.agents.filter(function (a) { return a.strat === k; });
      if (g.length) s.byStrategy[k] = { n: g.length, credits: g.reduce(function (p, a) { return p + a.credits; }, 0) / g.length, online: g.filter(function (a) { return a.online; }).length };
    });
    s.selfishOffline = S.agents.filter(function (a) { return !a.online && STRATS[a.strat].team === 'selfish'; }).length;
    s.coopOffline = S.agents.filter(function (a) { return !a.online && STRATS[a.strat].team === 'coop'; }).length;
    return s;
  }

  function makeEngine() {
    return {
      DEFAULTS: DEFAULTS, STRATS: STRATS, STRAT_KEYS: STRAT_KEYS, PLAN: PLAN, KINDS: KINDS, LABEL: LABEL,
      SCARCITY: SCARCITY, RULESETS: RULESETS,
      rng: rng, create: create, step: step, summary: summary, run: run, gini: gini,
      trustOf: trustOf, rep: rep, richest: richest, poorest: poorest
    };
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = makeEngine;
  else root.makeEngine = makeEngine;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
window.NASHNET_SCREENS = {"welcome":{"title":"NashNet · Welcome","template":"\n<x-head>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap\">\n<style>\nhtml{color-scheme:dark}\nbody{margin:0;background:#0B0E14}\n*{scrollbar-width:thin;scrollbar-color:#2A3242 transparent}\na{color:#AEB6C6}a:hover{color:#E6EAF2}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:.4}\nbutton:focus-visible,a:focus-visible{outline:2px solid #6E8BFF;outline-offset:2px}\n<\/style>\n<\/x-head>\n<div style=\"min-height: 100vh; background: #0B0E14; color: #E6EAF2; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px\">\n<div style=\"max-width: 1440px; margin: 0 auto; padding: 0 24px 56px; box-sizing: border-box\">\n\n<header style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding: 18px 0; border-bottom: 1px solid #1E2635\">\n  <div style=\"display: flex; align-items: center; gap: 12px\">\n    <div aria-hidden=\"true\" style=\"width: 36px; height: 36px; border-radius: 10px; background: #E6EAF2; display: flex; align-items: center; justify-content: center\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#0B0E14\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"5\" cy=\"5\" r=\"2.4\"><\/circle><circle cx=\"15\" cy=\"5\" r=\"2.4\"><\/circle><circle cx=\"10\" cy=\"15\" r=\"2.4\"><\/circle><path d=\"M6.4 7.2l2.4 5.6M13.6 7.2l-2.4 5.6M7.6 5h4.8\"><\/path><\/svg>\n    <\/div>\n    <div>\n      <div style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em\">NashNet<\/div>\n      <div style=\"font-size: 12px; color: #8A94A8\">Compute Commons · multi-agent game theory testbed<\/div>\n    <\/div>\n  <\/div>\n  <nav aria-label=\"Views\" style=\"display: flex; flex-wrap: wrap; gap: 4px; background: #121722; border: 1px solid #1E2635; border-radius: 12px; padding: 4px\">\n    <a href=\"#/welcome\" aria-current=\"page\" style=\"padding: 10px 14px; border-radius: 8px; background: #E6EAF2; color: #0B0E14; text-decoration: none; font-weight: 600; font-size: 13px\">0 · Welcome<\/a>\n    <a href=\"#/world\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">1 · World<\/a>\n    <a href=\"#/showdown\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">2 · Showdown<\/a>\n    <a href=\"#/lab\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">3 · Experiment Lab<\/a>\n  <\/nav>\n<\/header>\n\n<section style=\"display: flex; flex-wrap: wrap; gap: 32px; padding: 48px 0 40px; align-items: flex-start\">\n  <div style=\"flex: 1 1 560px; min-width: 0\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #8A94A8\">GAME THEORY IN MULTI-AGENT SYSTEMS<\/div>\n    <h1 style=\"margin: 14px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 52px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em\">Can selfish AI agents share a scarce cloud without wrecking it?<\/h1>\n    <p style=\"margin: 18px 0 0; font-size: 18px; line-height: 1.6; color: #C4CAD6; max-width: 640px\">NashNet drops 10 autonomous AI tenants into a city edge cloud with limited GPU, bandwidth and power. Each tenant decides for itself whether to share or cheat. We change the platform’s rules and measure what happens to everyone.<\/p>\n\n    <div style=\"margin-top: 28px; padding: 20px 22px; border-radius: 16px; background: #121722; border: 1px solid #2A3242\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #2DD4A7\">THE GOAL<\/div>\n      <div style=\"margin-top: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.3\">Find the platform rule that keeps the most tenants online and makes cheating stop paying.<\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px\">\n        <div style=\"padding: 12px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\">\n          <div style=\"font-weight: 600\">Tenants online<\/div>\n          <div style=\"font-size: 13px; color: #8A94A8; margin-top: 2px\">How many survive a 150-tick season (out of 10)<\/div>\n        <\/div>\n        <div style=\"padding: 12px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\">\n          <div style=\"font-weight: 600\">Jobs served<\/div>\n          <div style=\"font-size: 13px; color: #8A94A8; margin-top: 2px\">Share of incoming AI jobs that got computed<\/div>\n        <\/div>\n        <div style=\"padding: 12px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\">\n          <div style=\"font-weight: 600\">Does cheating pay?<\/div>\n          <div style=\"font-size: 13px; color: #8A94A8; margin-top: 2px\">Selfish tenants’ earnings vs. cooperative tenants’<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px\">\n      <a href=\"#/world\" style=\"display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 12px; background: #E6EAF2; color: #0B0E14; text-decoration: none; font-weight: 600; font-size: 16px\">Start the guided demo →<\/a>\n      <a href=\"#/showdown\" style=\"display: inline-flex; align-items: center; height: 52px; padding: 0 22px; border-radius: 12px; border: 1px solid #2A3242; color: #E6EAF2; text-decoration: none; font-weight: 500\">Jump to the Policy Showdown<\/a>\n    <\/div>\n  <\/div>\n\n  <section aria-label=\"Try the dilemma\" style=\"flex: 1 1 440px; min-width: 0; background: #121722; border: 1px solid #2A3242; border-radius: 20px; padding: 22px\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8A94A8\">TRY IT FIRST · 6 ROUNDS<\/div>\n    <h2 style=\"margin: 6px 0 4px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700\">You vs. a tenant<\/h2>\n    <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #AEB6C6\">Sharing costs you <strong style=\"color: #E6EAF2\">1 unit<\/strong> and gives your partner <strong style=\"color: #E6EAF2\">3 units<\/strong> (spare capacity is worth more to someone who needs it). Keeping it costs nothing.<\/p>\n\n    <div style=\"margin-top: 16px\">\n      <div style=\"font-size: 13px; color: #8A94A8; margin-bottom: 8px\">Pick your opponent<\/div>\n      <div role=\"group\" aria-label=\"Opponent\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px\">\n        <sc-for list=\"{{opps}}\" as=\"op\">\n          <button type=\"button\" onClick=\"{{op.pick}}\" aria-pressed=\"{{op.active}}\" style=\"display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 10px; border-radius: 10px; border: 1px solid {{op.border}}; background: {{op.bg}}; color: #E6EAF2; text-align: left\">\n            <span style=\"width: 26px; height: 26px; flex: none; border-radius: 50%; background: {{op.color}}; color: #0B0E14; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px; line-height: 26px; text-align: center\">{{op.glyph}}<\/span>\n            <span style=\"font-size: 13px; line-height: 1.25\"><span style=\"font-weight: 600\">{{op.name}}<\/span><br><span style=\"color: #8A94A8; font-size: 11px\">{{op.strat}}<\/span><\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n\n    <div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 18px\">\n      <sc-for list=\"{{slots}}\" as=\"sl\">\n        <div style=\"padding: 8px 4px; border-radius: 10px; background: #0B0E14; border: 1px solid {{sl.border}}; text-align: center\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8A94A8\">R{{sl.n}}<\/div>\n          <div style=\"margin-top: 4px; font-size: 11px; color: #8A94A8\">you<\/div>\n          <div style=\"font-weight: 600; font-size: 13px; color: {{sl.youColor}}\">{{sl.you}}<\/div>\n          <div style=\"margin-top: 2px; font-size: 11px; color: #8A94A8\">bot<\/div>\n          <div style=\"font-weight: 600; font-size: 13px; color: {{sl.botColor}}\">{{sl.bot}}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px\">\n      <button type=\"button\" onClick=\"{{share}}\" disabled=\"{{done}}\" style=\"height: 56px; border-radius: 12px; border: 0; background: #2DD4A7; color: #0B0E14; font-weight: 700; font-size: 16px\">Share <span style=\"font-weight: 500; font-size: 13px\">(cooperate)<\/span><\/button>\n      <button type=\"button\" onClick=\"{{keep}}\" disabled=\"{{done}}\" style=\"height: 56px; border-radius: 12px; border: 0; background: #FF6B4A; color: #0B0E14; font-weight: 700; font-size: 16px\">Keep it <span style=\"font-weight: 500; font-size: 13px\">(defect)<\/span><\/button>\n    <\/div>\n\n    <div style=\"display: flex; align-items: stretch; gap: 10px; margin-top: 16px\">\n      <div style=\"flex: 1; padding: 12px; border-radius: 12px; background: #0B0E14; border: 1px solid #1E2635\">\n        <div style=\"font-size: 12px; color: #8A94A8\">Your score<\/div>\n        <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700\">{{you}}<\/div>\n      <\/div>\n      <div style=\"flex: 1; padding: 12px; border-radius: 12px; background: #0B0E14; border: 1px solid #1E2635\">\n        <div style=\"font-size: 12px; color: #8A94A8\">Bot’s score<\/div>\n        <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700\">{{bot}}<\/div>\n      <\/div>\n      <div style=\"flex: 1.2; padding: 12px; border-radius: 12px; background: rgba(45,212,167,0.08); border: 1px solid rgba(45,212,167,0.3)\">\n        <div style=\"font-size: 12px; color: #8A94A8\">If both always share<\/div>\n        <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; color: #2DD4A7\">12 <span style=\"font-size: 14px; font-weight: 500\">each<\/span><\/div>\n      <\/div>\n    <\/div>\n    <p style=\"margin: 14px 0 0; min-height: 48px; font-size: 14px; line-height: 1.5; color: #D4D9E3\">{{msg}}<\/p>\n    <button type=\"button\" onClick=\"{{reset}}\" style=\"margin-top: 6px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #2A3242; background: transparent; color: #AEB6C6; font-size: 13px\">Play again<\/button>\n  <\/section>\n<\/section>\n\n<section aria-label=\"The problem\" style=\"padding: 32px 0; border-top: 1px solid #1E2635\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #8A94A8\">THE PROBLEM IN THREE STEPS<\/div>\n  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px\">\n    <div style=\"background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 20px\">\n      <svg width=\"100%\" height=\"120\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"A grid with GPU, bandwidth and power tiles and a few tenants\">\n        <rect x=\"0\" y=\"0\" width=\"300\" height=\"120\" rx=\"10\" fill=\"#0E131C\"><\/rect>\n        <rect x=\"30\" y=\"20\" width=\"26\" height=\"26\" rx=\"5\" fill=\"rgba(233,162,59,0.55)\" stroke=\"#E9A23B\"><\/rect>\n        <rect x=\"140\" y=\"64\" width=\"26\" height=\"26\" rx=\"5\" fill=\"rgba(56,189,248,0.55)\" stroke=\"#38BDF8\"><\/rect>\n        <rect x=\"240\" y=\"26\" width=\"26\" height=\"26\" rx=\"5\" fill=\"rgba(155,225,93,0.55)\" stroke=\"#9BE15D\"><\/rect>\n        <circle cx=\"90\" cy=\"70\" r=\"11\" fill=\"#6E8BFF\"><\/circle><circle cx=\"200\" cy=\"40\" r=\"11\" fill=\"#FF6B4A\"><\/circle><circle cx=\"250\" cy=\"92\" r=\"11\" fill=\"#2DD4A7\"><\/circle><circle cx=\"60\" cy=\"96\" r=\"11\" fill=\"#C08BFF\"><\/circle>\n      <\/svg>\n      <div style=\"margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">01<\/div>\n      <h3 style=\"margin: 4px 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 20px\">A shared cloud<\/h3>\n      <p style=\"margin: 0; line-height: 1.55; color: #AEB6C6\">Every AI job needs GPU, bandwidth and power. They come from shared zones spread across the city, and zones only regrow slowly.<\/p>\n    <\/div>\n    <div style=\"background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 20px\">\n      <svg width=\"100%\" height=\"120\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Two tenants: sharing gives both plus two, cheating gives the cheater plus three and the victim minus one\">\n        <rect x=\"0\" y=\"0\" width=\"300\" height=\"120\" rx=\"10\" fill=\"#0E131C\"><\/rect>\n        <circle cx=\"60\" cy=\"60\" r=\"20\" fill=\"#6E8BFF\"><\/circle><circle cx=\"240\" cy=\"60\" r=\"20\" fill=\"#FF6B4A\"><\/circle>\n        <path d=\"M86 48h128\" stroke=\"#2DD4A7\" stroke-width=\"3\"><\/path><path d=\"M206 42l10 6-10 6\" fill=\"none\" stroke=\"#2DD4A7\" stroke-width=\"3\"><\/path>\n        <path d=\"M214 74H86\" stroke=\"#5C667A\" stroke-width=\"3\" stroke-dasharray=\"6 6\"><\/path>\n        <text x=\"150\" y=\"38\" fill=\"#2DD4A7\" font-size=\"13\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\">shares 1 → gets 3<\/text>\n        <text x=\"150\" y=\"98\" fill=\"#FF8A6B\" font-size=\"13\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\">gives nothing back<\/text>\n      <\/svg>\n      <div style=\"margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">02<\/div>\n      <h3 style=\"margin: 4px 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 20px\">The temptation to cheat<\/h3>\n      <p style=\"margin: 0; line-height: 1.55; color: #AEB6C6\">Sharing makes both sides better off (+2 each). But taking without giving wins any single round (+3 vs −1). That is the Prisoner’s Dilemma.<\/p>\n    <\/div>\n    <div style=\"background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 20px\">\n      <svg width=\"100%\" height=\"120\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"A zone reserve bar falling below the safe line\">\n        <rect x=\"0\" y=\"0\" width=\"300\" height=\"120\" rx=\"10\" fill=\"#0E131C\"><\/rect>\n        <rect x=\"40\" y=\"20\" width=\"40\" height=\"80\" rx=\"6\" fill=\"#1E2635\"><\/rect><rect x=\"40\" y=\"30\" width=\"40\" height=\"70\" rx=\"6\" fill=\"rgba(155,225,93,0.6)\"><\/rect>\n        <rect x=\"130\" y=\"20\" width=\"40\" height=\"80\" rx=\"6\" fill=\"#1E2635\"><\/rect><rect x=\"130\" y=\"62\" width=\"40\" height=\"38\" rx=\"6\" fill=\"rgba(233,162,59,0.6)\"><\/rect>\n        <rect x=\"220\" y=\"20\" width=\"40\" height=\"80\" rx=\"6\" fill=\"#1E2635\"><\/rect><rect x=\"220\" y=\"90\" width=\"40\" height=\"10\" rx=\"4\" fill=\"rgba(255,107,74,0.7)\"><\/rect>\n        <path d=\"M24 68h252\" stroke=\"#E6EAF2\" stroke-dasharray=\"4 4\"><\/path>\n        <text x=\"276\" y=\"62\" fill=\"#AEB6C6\" font-size=\"11\" text-anchor=\"end\" font-family=\"JetBrains Mono, monospace\">safe reserve 40%<\/text>\n      <\/svg>\n      <div style=\"margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">03<\/div>\n      <h3 style=\"margin: 4px 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 20px\">The tragedy of the commons<\/h3>\n      <p style=\"margin: 0; line-height: 1.55; color: #AEB6C6\">Hoarders drain zones below their safe reserve. A drained zone regrows slowly, so everyone starves, and tenants start going offline.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section aria-label=\"Meet the tenants\" style=\"padding: 32px 0; border-top: 1px solid #1E2635\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #8A94A8\">MEET THE 10 TENANTS · 6 STRATEGIES<\/div>\n    <div style=\"margin-left: auto; display: flex; gap: 14px; font-size: 13px; color: #AEB6C6\">\n      <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #2DD4A7\"><\/span>Cooperative team<\/span>\n      <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span style=\"width: 10px; height: 10px; border-radius: 3px; background: #FF6B4A\"><\/span>Selfish team<\/span>\n    <\/div>\n  <\/div>\n  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 16px\">\n    <sc-for list=\"{{cast}}\" as=\"c\">\n      <div style=\"background: #121722; border: 1px solid #1E2635; border-top: 3px solid {{c.teamColor}}; border-radius: 14px; padding: 16px\">\n        <div style=\"display: flex; align-items: center; gap: 10px\">\n          <span style=\"width: 36px; height: 36px; border-radius: 50%; background: {{c.color}}; color: #0B0E14; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 15px; line-height: 36px; text-align: center\">{{c.glyph}}<\/span>\n          <div>\n            <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700\">The {{c.short}}<\/div>\n            <div style=\"font-size: 12px; color: #8A94A8\">{{c.name}} · {{c.ids}}<\/div>\n          <\/div>\n        <\/div>\n        <p style=\"margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: #C4CAD6\">{{c.blurb}}<\/p>\n        <div style=\"margin-top: 10px; display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: {{c.teamBg}}; color: {{c.teamColor}}\">{{c.team}}<\/div>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n<\/section>\n\n<section style=\"display: flex; flex-wrap: wrap; gap: 20px; padding: 32px 0; border-top: 1px solid #1E2635\">\n  <div aria-label=\"How to read the map\" style=\"flex: 1 1 420px; min-width: 0\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #8A94A8\">HOW TO READ THE MAP<\/div>\n    <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 16px\">\n      <div style=\"display: flex; align-items: center; gap: 14px\"><span style=\"position: relative; width: 26px; height: 26px; flex: none; box-sizing: border-box; border-radius: 6px; border: 1px solid #E9A23B; background: rgba(233,162,59,0.1); overflow: hidden\"><span style=\"position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: rgba(233,162,59,0.6)\"><\/span><\/span><span><strong>Zone tile.<\/strong> <span style=\"color: #AEB6C6\">Amber GPU, blue bandwidth, green power. The fill shows how much is left.<\/span><\/span><\/div>\n      <div style=\"display: flex; align-items: center; gap: 14px\"><span style=\"width: 26px; height: 26px; flex: none; border-radius: 50%; background: #6E8BFF; color: #0B0E14; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px; line-height: 26px; text-align: center\">T<\/span><span><strong>Tenant.<\/strong> <span style=\"color: #AEB6C6\">Colour and letter = strategy. Click one to inspect it.<\/span><\/span><\/div>\n      <div style=\"display: flex; align-items: center; gap: 14px\"><span style=\"width: 26px; height: 3px; flex: none; background: #2DD4A7\"><\/span><span><strong>Green line.<\/strong> <span style=\"color: #AEB6C6\">Two tenants just shared or swapped capacity.<\/span><\/span><\/div>\n      <div style=\"display: flex; align-items: center; gap: 14px\"><span style=\"width: 26px; height: 3px; flex: none; background: #FF6B4A\"><\/span><span><strong>Orange line.<\/strong> <span style=\"color: #AEB6C6\">Someone cheated, refused or grabbed.<\/span><\/span><\/div>\n      <div style=\"display: flex; align-items: center; gap: 14px\"><span style=\"width: 26px; height: 26px; flex: none; box-sizing: border-box; border: 1px dashed #AEB6C6; border-radius: 6px\"><\/span><span><strong>Dashed square.<\/strong> <span style=\"color: #AEB6C6\">Who the selected tenant can see and meet (3 cells).<\/span><\/span><\/div>\n      <div style=\"display: flex; align-items: center; gap: 14px\"><span style=\"width: 26px; height: 26px; flex: none; border-radius: 50%; background: #2A3242; color: #7D8799; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 26px; text-align: center\">×<\/span><span><strong>Grey tenant.<\/strong> <span style=\"color: #AEB6C6\">Offline: it ran out of resources.<\/span><\/span><\/div>\n    <\/div>\n  <\/div>\n  <div aria-label=\"Rules the platform can switch on\" style=\"flex: 1 1 520px; min-width: 0\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #8A94A8\">RULES THE PLATFORM CAN SWITCH ON<\/div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 16px\">\n      <div style=\"padding: 14px; border-radius: 12px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-weight: 600\">Memory<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">Tenants remember who cheated them.<\/div><div style=\"font-size: 12px; color: #9DB0FF; margin-top: 8px\">Targets: cheating in trades<\/div><\/div>\n      <div style=\"padding: 14px; border-radius: 12px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-weight: 600\">Reputation ledger<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">A public trust score everyone can check.<\/div><div style=\"font-size: 12px; color: #9DB0FF; margin-top: 8px\">Targets: cheating in trades<\/div><\/div>\n      <div style=\"padding: 14px; border-radius: 12px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-weight: 600\">Commons quotas<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">Nobody may take more than 3 units or drain a zone below 40%.<\/div><div style=\"font-size: 12px; color: #F2B862; margin-top: 8px\">Targets: draining the commons<\/div><\/div>\n      <div style=\"padding: 14px; border-radius: 12px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-weight: 600\">Congestion pricing<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">Taking from a nearly empty zone costs extra credits.<\/div><div style=\"font-size: 12px; color: #F2B862; margin-top: 8px\">Targets: draining the commons<\/div><\/div>\n      <div style=\"padding: 14px; border-radius: 12px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-weight: 600\">Random audits<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">40% chance to catch a cheat or over-drain: fine plus repayment.<\/div><div style=\"font-size: 12px; color: #2DD4A7; margin-top: 8px\">Targets: both problems<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section aria-label=\"One tick\" style=\"padding: 32px 0; border-top: 1px solid #1E2635\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #8A94A8\">WHAT HAPPENS IN ONE TICK<\/div>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-top: 16px\">\n    <div style=\"flex: 1 1 180px; padding: 16px; border-radius: 14px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">1<\/div><div style=\"font-weight: 600; font-size: 17px\">Observe<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">Each tenant sees only its 3-cell neighbourhood.<\/div><\/div>\n    <div aria-hidden=\"true\" style=\"align-self: center; color: #5C667A; font-size: 20px\">→<\/div>\n    <div style=\"flex: 1 1 180px; padding: 16px; border-radius: 14px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">2<\/div><div style=\"font-weight: 600; font-size: 17px\">Evaluate<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">It scores each possible action by expected utility.<\/div><\/div>\n    <div aria-hidden=\"true\" style=\"align-self: center; color: #5C667A; font-size: 20px\">→<\/div>\n    <div style=\"flex: 1 1 180px; padding: 16px; border-radius: 14px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">3<\/div><div style=\"font-weight: 600; font-size: 17px\">Choose<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">Its strategy decides: share, cheat, swap or grab.<\/div><\/div>\n    <div aria-hidden=\"true\" style=\"align-self: center; color: #5C667A; font-size: 20px\">→<\/div>\n    <div style=\"flex: 1 1 180px; padding: 16px; border-radius: 14px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">4<\/div><div style=\"font-weight: 600; font-size: 17px\">Interact<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">Resources move; the platform’s rules apply.<\/div><\/div>\n    <div aria-hidden=\"true\" style=\"align-self: center; color: #5C667A; font-size: 20px\">→<\/div>\n    <div style=\"flex: 1 1 180px; padding: 16px; border-radius: 14px; background: #121722; border: 1px solid #1E2635\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">5<\/div><div style=\"font-weight: 600; font-size: 17px\">Update<\/div><div style=\"font-size: 13px; color: #AEB6C6; margin-top: 4px\">Memory, reputation and the event log are written.<\/div><\/div>\n  <\/div>\n<\/section>\n\n<section aria-label=\"Demo script\" style=\"padding: 32px 0 0; border-top: 1px solid #1E2635\">\n  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; color: #8A94A8\">THE 5-MINUTE DEMO SCRIPT<\/div>\n  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 16px\">\n    <sc-for list=\"{{script}}\" as=\"s\">\n      <a href=\"{{s.href}}\" style=\"display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 14px; background: #121722; border: 1px solid #1E2635; text-decoration: none; color: #E6EAF2\">\n        <span style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #E6EAF2; color: #0B0E14; font-weight: 700; font-size: 13px; line-height: 28px; text-align: center\">{{s.n}}<\/span><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A94A8\">{{s.time}}<\/span><\/span>\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700\">{{s.title}}<\/span>\n        <span style=\"font-size: 14px; line-height: 1.5; color: #AEB6C6\">{{s.say}}<\/span>\n        <span style=\"margin-top: auto; font-size: 13px; color: #9DB0FF\">Open {{s.screen}} →<\/span>\n      <\/a>\n    <\/sc-for>\n  <\/div>\n  <p style=\"margin: 24px 0 0; font-size: 13px; color: #8A94A8\">Runs entirely in the browser (JavaScript engine, no backend). Every run is reproducible from its seed.<\/p>\n<\/section>\n\n<\/div>\n<\/div>\n","style":"\nhtml{color-scheme:dark}\nbody{margin:0;background:#0B0E14}\n*{scrollbar-width:thin;scrollbar-color:#2A3242 transparent}\na{color:#AEB6C6}a:hover{color:#E6EAF2}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:.4}\nbutton:focus-visible,a:focus-visible{outline:2px solid #6E8BFF;outline-offset:2px}\n","script":"\nclass Component extends Screen {\n  renderVals() {\n    const s = this.state || {};\n    const opp = s.opp || 'TFT';\n    const rounds = s.rounds || [];\n    const set = p => this.setState(p);\n    const OPP = {\n      TFT: { name: 'The Mirror', strat: 'Tit-for-Tat', glyph: 'T', color: '#6E8BFF' },\n      ALLC: { name: 'The Giver', strat: 'Always Cooperate', glyph: 'C', color: '#2DD4A7' },\n      ALLD: { name: 'The Hoarder', strat: 'Always Defect', glyph: 'D', color: '#FF6B4A' }\n    };\n    const botMove = () => opp === 'ALLC' ? 'S' : opp === 'ALLD' ? 'K' : (rounds.length ? rounds[rounds.length - 1].you : 'S');\n    let you = 0, bot = 0;\n    rounds.forEach(r => {\n      if (r.you === 'S') { you -= 1; bot += 3; }\n      if (r.bot === 'S') { bot -= 1; you += 3; }\n    });\n    const done = rounds.length >= 6;\n    const play = m => {\n      if (done) return;\n      set({ rounds: rounds.concat([{ you: m, bot: botMove() }]) });\n    };\n    let msg;\n    if (!rounds.length) msg = 'Make your first move. The bot moves at the same time.';\n    else if (!done) {\n      const r = rounds[rounds.length - 1];\n      const nm = OPP[opp].name;\n      if (r.you === 'S' && r.bot === 'S') msg = 'You both shared: +2 each. This is the cooperative outcome.';\n      else if (r.you === 'K' && r.bot === 'S') msg = 'You kept yours while ' + nm + ' shared: +3 for you, −1 for it.' + (opp === 'TFT' ? ' It will remember that next round.' : '');\n      else if (r.you === 'S' && r.bot === 'K') msg = 'You shared, ' + nm + ' kept its capacity: −1 for you, +3 for it.';\n      else msg = 'Nobody shared. Nobody gains: 0 each.';\n    } else {\n      if (opp === 'TFT') msg = you >= 10 ? 'Mirror rewards you for sharing: cooperation pays when you meet again. This is why memory matters.' : 'Every time you cheated, the Mirror cheated back. Exploiting a reciprocator stops paying after round one.';\n      else if (opp === 'ALLC') msg = you > 12 ? 'Exploiting the Giver earns you more, but only because it never fights back. In the simulation, Givers are the first to go offline.' : 'You and the Giver both did well. Cooperation is easy against someone who never cheats.';\n      else msg = 'Against the Hoarder, sharing is just a loss. That is why tenants need a way to recognise cheaters.';\n    }\n    const opps = Object.keys(OPP).map(k => ({\n      name: OPP[k].name, strat: OPP[k].strat, glyph: OPP[k].glyph, color: OPP[k].color, active: opp === k,\n      bg: opp === k ? 'rgba(230,234,242,0.08)' : '#0B0E14', border: opp === k ? '#AEB6C6' : '#1E2635',\n      pick: () => set({ opp: k, rounds: [] })\n    }));\n    const slots = [];\n    for (let i = 0; i < 6; i++) {\n      const r = rounds[i];\n      slots.push({\n        n: i + 1,\n        you: r ? (r.you === 'S' ? 'Share' : 'Keep') : '·',\n        bot: r ? (r.bot === 'S' ? 'Share' : 'Keep') : '·',\n        youColor: r ? (r.you === 'S' ? '#2DD4A7' : '#FF8A6B') : '#5C667A',\n        botColor: r ? (r.bot === 'S' ? '#2DD4A7' : '#FF8A6B') : '#5C667A',\n        border: i === rounds.length && !done ? '#AEB6C6' : '#1E2635'\n      });\n    }\n    const cast = [\n      { glyph: 'T', color: '#6E8BFF', short: 'Mirror', name: 'Tit-for-Tat', ids: 'A1, A2', blurb: 'Shares on first contact, then copies whatever you did to it last time.', team: 'Cooperative', coop: true },\n      { glyph: 'C', color: '#2DD4A7', short: 'Giver', name: 'Always Cooperate', ids: 'A5, A6', blurb: 'Always shares spare capacity, even with tenants who cheat it.', team: 'Cooperative', coop: true },\n      { glyph: '$', color: '#C08BFF', short: 'Trader', name: 'Trader', ids: 'A7, A8', blurb: 'Swaps capacity only with partners it trusts at least a little.', team: 'Cooperative', coop: true },\n      { glyph: 'R', color: '#E8ECF4', short: 'Checker', name: 'Reputation-aware', ids: 'A10', blurb: 'Looks up a partner’s reputation before deciding to cooperate.', team: 'Cooperative', coop: true },\n      { glyph: 'D', color: '#FF6B4A', short: 'Hoarder', name: 'Always Defect', ids: 'A3, A4', blurb: 'Accepts what others offer, gives nothing back, and over-drains zones.', team: 'Selfish', coop: false },\n      { glyph: 'A', color: '#FF4D8D', short: 'Grabber', name: 'Aggressive', ids: 'A9', blurb: 'Tries to take other tenants’ capacity by force, and over-drains zones.', team: 'Selfish', coop: false }\n    ].map(c => Object.assign(c, { teamColor: c.coop ? '#2DD4A7' : '#FF6B4A', teamBg: c.coop ? 'rgba(45,212,167,0.12)' : 'rgba(255,107,74,0.12)' }));\n    const script = [\n      { n: 1, time: '0:30', title: 'Frame the problem', say: 'Play 3 rounds of the mini-game above against the Mirror. That is the dilemma every tenant faces.', href: '#/welcome', screen: 'Welcome' },\n      { n: 2, time: '1:30', title: 'Watch the commons fail', say: 'In World, keep “No rules” and press Play. Watch the live leaderboard: Hoarders climb to the top while Givers drop offline.', href: '#/world', screen: 'World' },\n      { n: 3, time: '1:00', title: 'Explain one decision', say: 'Pause, click a tenant, read its trust list and its next move. Then step one tick.', href: '#/world', screen: 'World' },\n      { n: 4, time: '1:30', title: 'Race the rule sets', say: 'In the Showdown, run the same world under four rule sets side by side and read the final ranking.', href: '#/showdown', screen: 'Showdown' },\n      { n: 5, time: '0:45', title: 'Prove it with statistics', say: 'In the Experiment Lab, run hundreds of seeds and show the confidence intervals and the scarcity heatmap.', href: '#/lab', screen: 'Experiment Lab' }\n    ];\n    return {\n      opps: opps, slots: slots, you: you, bot: bot, done: done, msg: msg,\n      share: () => play('S'), keep: () => play('K'), reset: () => set({ rounds: [] }),\n      cast: cast, script: script\n    };\n  }\n}\n"},"world":{"title":"NashNet · World","template":"\n<x-head>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap\">\n<style>\nhtml{color-scheme:dark}\nbody{margin:0;background:#0B0E14}\n*{scrollbar-width:thin;scrollbar-color:#2A3242 transparent}\na{color:#AEB6C6}a:hover{color:#E6EAF2}\nbutton{font:inherit;cursor:pointer}\nbutton:disabled{cursor:not-allowed;opacity:.4}\nbutton:focus-visible,a:focus-visible{outline:2px solid #6E8BFF;outline-offset:2px}\n<\/style>\n<\/x-head>\n<div style=\"min-height: 100vh; background: #0B0E14; color: #E6EAF2; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px\">\n<div style=\"max-width: 1440px; margin: 0 auto; padding: 0 24px 48px; box-sizing: border-box\">\n\n<header style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding: 18px 0; border-bottom: 1px solid #1E2635\">\n  <div style=\"display: flex; align-items: center; gap: 12px\">\n    <div aria-hidden=\"true\" style=\"width: 36px; height: 36px; border-radius: 10px; background: #E6EAF2; display: flex; align-items: center; justify-content: center\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#0B0E14\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"5\" cy=\"5\" r=\"2.4\"><\/circle><circle cx=\"15\" cy=\"5\" r=\"2.4\"><\/circle><circle cx=\"10\" cy=\"15\" r=\"2.4\"><\/circle><path d=\"M6.4 7.2l2.4 5.6M13.6 7.2l-2.4 5.6M7.6 5h4.8\"><\/path><\/svg>\n    <\/div>\n    <div>\n      <div style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em\">NashNet<\/div>\n      <div style=\"font-size: 12px; color: #8A94A8\">Compute Commons · multi-agent game theory testbed<\/div>\n    <\/div>\n  <\/div>\n  <nav aria-label=\"Views\" style=\"display: flex; flex-wrap: wrap; gap: 4px; background: #121722; border: 1px solid #1E2635; border-radius: 12px; padding: 4px\">\n    <a href=\"#/welcome\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">0 · Welcome<\/a>\n    <a href=\"#/world\" aria-current=\"page\" style=\"padding: 10px 14px; border-radius: 8px; background: #E6EAF2; color: #0B0E14; text-decoration: none; font-weight: 600; font-size: 13px\">1 · World<\/a>\n    <a href=\"#/showdown\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">2 · Showdown<\/a>\n    <a href=\"#/lab\" style=\"padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 13px\">3 · Experiment Lab<\/a>\n  <\/nav>\n  <button type=\"button\" onClick=\"{{toggleTour}}\" style=\"margin-left: auto; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #2A3242; background: transparent; color: #E6EAF2; font-size: 13px\">{{tourBtn}}<\/button>\n<\/header>\n\n<div style=\"margin: 22px 0 16px\">\n  <h1 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em\">World: one city edge cloud, live<\/h1>\n  <p style=\"margin: 6px 0 0; color: #AEB6C6; max-width: 820px\">10 AI tenants, 24 capacity zones, one 150-tick season. Pick the platform’s rules, press Play, and watch whether the commons survives.<\/p>\n<\/div>\n\n<sc-if value=\"{{tourOn}}\">\n  <section aria-label=\"Guided tour\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 16px; padding: 16px 18px; border-radius: 16px; background: linear-gradient(90deg, rgba(110,139,255,0.16), rgba(110,139,255,0.04)); border: 1px solid rgba(110,139,255,0.5)\">\n    <div style=\"width: 44px; height: 44px; flex: none; border-radius: 12px; background: #6E8BFF; color: #0B0E14; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 44px; text-align: center\">{{tour.n}}<\/div>\n    <div style=\"flex: 1 1 420px; min-width: 0\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9DB0FF\">GUIDED TOUR · STEP {{tour.n}} OF 5<\/div>\n      <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; margin-top: 2px\">{{tour.title}}<\/div>\n      <div style=\"margin-top: 4px; line-height: 1.5; color: #D4D9E3\">{{tour.text}}<\/div>\n    <\/div>\n    <div style=\"display: flex; gap: 8px\">\n      <button type=\"button\" onClick=\"{{tourBack}}\" disabled=\"{{tour.first}}\" style=\"height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A4458; background: transparent; color: #E6EAF2\">Back<\/button>\n      <sc-if value=\"{{tour.notLast}}\"><button type=\"button\" onClick=\"{{tourNext}}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #E6EAF2; color: #0B0E14; font-weight: 600\">Next step →<\/button><\/sc-if>\n      <sc-if value=\"{{tour.last}}\"><a href=\"#/showdown\" style=\"display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px; background: #E6EAF2; color: #0B0E14; font-weight: 600; text-decoration: none\">Open the Showdown →<\/a><\/sc-if>\n    <\/div>\n  <\/section>\n<\/sc-if>\n\n<section aria-label=\"Platform rules for this run\" style=\"background: #121722; border: 1px solid {{hl.rules}}; box-shadow: {{hl.rulesGlow}}; border-radius: 16px; padding: 16px; margin-bottom: 20px\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 12px\">\n    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8\">STEP A · CHOOSE THE PLATFORM’S RULES<\/span>\n    <span style=\"font-size: 12px; color: #8A94A8\">Changing a rule restarts the season with the same seed, so the only difference is the rule.<\/span>\n  <\/div>\n  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px\">\n    <sc-for list=\"{{scenarios}}\" as=\"sc\">\n      <button type=\"button\" onClick=\"{{sc.pick}}\" aria-pressed=\"{{sc.active}}\" style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 84px; padding: 12px 14px; border-radius: 12px; border: 2px solid {{sc.border}}; background: {{sc.bg}}; color: #E6EAF2; text-align: left\">\n        <span style=\"display: flex; align-items: center; gap: 8px; width: 100%\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{sc.color}}\"><\/span><span style=\"font-weight: 600; font-size: 15px\">{{sc.label}}<\/span><span style=\"margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: {{sc.tagColor}}\">{{sc.tag}}<\/span><\/span>\n        <span style=\"font-size: 12px; line-height: 1.4; color: #AEB6C6\">{{sc.desc}}<\/span>\n      <\/button>\n    <\/sc-for>\n  <\/div>\n  <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px\">\n    <span style=\"font-size: 13px; color: #AEB6C6\">Resource supply<\/span>\n    <div role=\"group\" aria-label=\"Resource supply\" style=\"display: flex; gap: 2px; background: #0B0E14; border: 1px solid #1E2635; border-radius: 10px; padding: 3px\">\n      <sc-for list=\"{{scarcities}}\" as=\"sx\">\n        <button type=\"button\" onClick=\"{{sx.pick}}\" aria-pressed=\"{{sx.active}}\" style=\"height: 36px; padding: 0 12px; border: 0; border-radius: 7px; background: {{sx.bg}}; color: {{sx.fg}}; font-size: 12px; font-weight: 500\">{{sx.label}}<\/button>\n      <\/sc-for>\n    <\/div>\n    <span style=\"font-size: 13px; color: #AEB6C6; margin-left: 8px\">Seed<\/span>\n    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 7px 10px; border-radius: 8px; background: #0B0E14; border: 1px solid #1E2635\">{{seed}}<\/span>\n    <button type=\"button\" onClick=\"{{newSeed}}\" style=\"height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A3242; background: transparent; color: #AEB6C6; font-size: 12px\">New map<\/button>\n    <button type=\"button\" onClick=\"{{toggleAdv}}\" aria-expanded=\"{{advOpen}}\" style=\"margin-left: auto; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A3242; background: transparent; color: #AEB6C6; font-size: 12px\">{{advLabel}}<\/button>\n  <\/div>\n  <sc-if value=\"{{advOpen}}\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #1E2635\">\n      <sc-for list=\"{{advRegs}}\" as=\"rg\">\n        <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\">\n          <div style=\"flex: 1; min-width: 0\"><div style=\"font-weight: 500; font-size: 13px\">{{rg.label}}<\/div><div style=\"font-size: 11px; color: #8A94A8\">{{rg.desc}}<\/div><\/div>\n          <button type=\"button\" onClick=\"{{rg.toggle}}\" aria-pressed=\"{{rg.on}}\" aria-label=\"{{rg.label}}\" style=\"position: relative; width: 48px; height: 28px; flex: none; border: 0; border-radius: 999px; background: {{rg.track}}\"><span style=\"position: absolute; top: 3px; left: {{rg.knob}}px; width: 22px; height: 22px; border-radius: 50%; background: #E6EAF2; transition: left .2s\"><\/span><\/button>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/sc-if>\n<\/section>\n\n<sc-if value=\"{{seasonOver}}\">\n  <section aria-label=\"Season result\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-bottom: 20px; padding: 18px 20px; border-radius: 16px; background: {{verdict.bg}}; border: 1px solid {{verdict.border}}\">\n    <div style=\"flex: 1 1 360px; min-width: 0\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #AEB6C6\">SEASON OVER · {{scenarioName}} · {{scarcityName}} SUPPLY<\/div>\n      <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; margin-top: 4px; color: {{verdict.color}}\">{{verdict.title}}<\/div>\n      <div style=\"margin-top: 4px; color: #D4D9E3\">{{verdict.text}}<\/div>\n    <\/div>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n      <button type=\"button\" onClick=\"{{reset}}\" style=\"height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #3A4458; background: transparent; color: #E6EAF2\">Replay this season<\/button>\n      <a href=\"#/showdown\" style=\"display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px; background: #E6EAF2; color: #0B0E14; font-weight: 600; text-decoration: none\">Compare all rule sets →<\/a>\n    <\/div>\n  <\/section>\n<\/sc-if>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n\n  <section aria-label=\"Simulation map\" style=\"flex: 999 1 640px; min-width: 0; background: #121722; border: 1px solid {{hl.map}}; box-shadow: {{hl.mapGlow}}; border-radius: 16px; padding: 16px\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 4px; margin: -4px -4px 14px; border-radius: 12px; outline: 2px solid {{hl.controls}}; outline-offset: 2px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8; width: 100%\">STEP B · RUN THE SEASON<\/span>\n      <button type=\"button\" onClick=\"{{togglePlay}}\" style=\"display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 12px; border: 0; background: #E6EAF2; color: #0B0E14; font-weight: 700; font-size: 15px\">\n        <sc-if value=\"{{playing}}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"currentColor\"><rect x=\"2\" y=\"1.5\" width=\"3.5\" height=\"11\" rx=\"1\"><\/rect><rect x=\"8.5\" y=\"1.5\" width=\"3.5\" height=\"11\" rx=\"1\"><\/rect><\/svg><\/sc-if>\n        <sc-if value=\"{{paused}}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"currentColor\"><path d=\"M3 1.8v10.4a.6.6 0 00.9.5l8.4-5.2a.6.6 0 000-1L3.9 1.3a.6.6 0 00-.9.5z\"><\/path><\/svg><\/sc-if>\n        {{playLabel}}\n      <\/button>\n      <button type=\"button\" onClick=\"{{stepOnce}}\" disabled=\"{{stepDisabled}}\" style=\"height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A3242; background: transparent; color: #E6EAF2; font-weight: 500\">Step 1 tick<\/button>\n      <button type=\"button\" onClick=\"{{reset}}\" style=\"height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A3242; background: transparent; color: #E6EAF2; font-weight: 500\">Restart<\/button>\n      <div role=\"group\" aria-label=\"Speed\" style=\"display: flex; gap: 2px; background: #0B0E14; border: 1px solid #1E2635; border-radius: 10px; padding: 3px\">\n        <sc-for list=\"{{speeds}}\" as=\"sp\">\n          <button type=\"button\" onClick=\"{{sp.pick}}\" aria-pressed=\"{{sp.active}}\" style=\"height: 38px; min-width: 52px; padding: 0 10px; border: 0; border-radius: 7px; background: {{sp.bg}}; color: {{sp.fg}}; font-size: 12px; font-weight: 500\">{{sp.label}}<\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"margin-left: auto; min-width: 190px\">\n        <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #8A94A8\"><span>Season progress<\/span><span style=\"font-family: 'JetBrains Mono', monospace; color: #E6EAF2\">tick {{tick}} / 150<\/span><\/div>\n        <div style=\"height: 6px; margin-top: 6px; border-radius: 3px; background: #1E2635; overflow: hidden\"><div style=\"height: 100%; width: {{seasonPct}}%; background: #6E8BFF\"><\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n      <div style=\"overflow-x: auto; overflow-y: hidden; max-width: 100%\">\n        <div style=\"display: grid; grid-template-columns: 22px 560px; grid-template-rows: 18px 560px; gap: 4px\">\n          <span><\/span>\n          <div style=\"position: relative; height: 18px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7D8799\">\n            <span style=\"position: absolute; left: 10px\">0<\/span><span style=\"position: absolute; left: 140px\">5<\/span><span style=\"position: absolute; left: 276px\">10<\/span><span style=\"position: absolute; left: 416px\">15<\/span><span style=\"position: absolute; left: 528px\">19<\/span>\n          <\/div>\n          <div style=\"position: relative; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #7D8799; text-align: right\">\n            <span style=\"position: absolute; right: 2px; top: 8px\">0<\/span><span style=\"position: absolute; right: 2px; top: 148px\">5<\/span><span style=\"position: absolute; right: 2px; top: 288px\">10<\/span><span style=\"position: absolute; right: 2px; top: 428px\">15<\/span><span style=\"position: absolute; right: 2px; top: 540px\">19<\/span>\n          <\/div>\n          <div role=\"img\" aria-label=\"Map of the city edge cloud: 20 by 20 cells with capacity zones and tenants\" style=\"position: relative; box-sizing: border-box; width: 560px; height: 560px; border-radius: 12px; overflow: hidden; background-color: #0E131C; background-image: linear-gradient(#18202E 1px, transparent 1px), linear-gradient(90deg, #18202E 1px, transparent 1px); background-size: 28px 28px; border: 1px solid #1E2635\">\n            <sc-for list=\"{{zones}}\" as=\"z\">\n              <div title=\"{{z.title}}\" style=\"position: absolute; left: {{z.left}}px; top: {{z.top}}px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 5px; border: 1px solid {{z.border}}; background: {{z.bg}}; overflow: hidden\">\n                <div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: {{z.h}}%; background: {{z.fill}}; transition: height .3s\"><\/div>\n                <span style=\"position: absolute; inset: 0; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; line-height: 22px; text-align: center; color: #E6EAF2; opacity: .85\">{{z.letter}}<\/span>\n              <\/div>\n            <\/sc-for>\n            <div aria-hidden=\"true\" style=\"position: absolute; left: {{radius.left}}px; top: {{radius.top}}px; width: 196px; height: 196px; box-sizing: border-box; border: 1px dashed rgba(230,234,242,0.4); border-radius: 14px; background: rgba(230,234,242,0.03); transition: left .3s ease, top .3s ease; pointer-events: none\"><\/div>\n            <sc-for list=\"{{links}}\" as=\"l\">\n              <div aria-hidden=\"true\" style=\"position: absolute; left: {{l.left}}px; top: {{l.top}}px; width: {{l.width}}px; height: 3px; border-radius: 2px; background: {{l.color}}; opacity: {{l.opacity}}; transform-origin: 0 50%; transform: rotate({{l.angle}}deg); pointer-events: none\"><\/div>\n            <\/sc-for>\n            <sc-for list=\"{{agents}}\" as=\"ag\">\n              <button type=\"button\" onClick=\"{{ag.pick}}\" aria-label=\"{{ag.label}}\" title=\"{{ag.label}}\" style=\"position: absolute; left: {{ag.left}}px; top: {{ag.top}}px; z-index: {{ag.z}}; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: {{ag.bg}}; color: {{ag.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; line-height: 24px; text-align: center; box-shadow: {{ag.shadow}}; transition: left .3s ease, top .3s ease, box-shadow .2s\">{{ag.glyph}}<\/button>\n              <span aria-hidden=\"true\" style=\"position: absolute; left: {{ag.labelLeft}}px; top: {{ag.labelTop}}px; z-index: {{ag.z}}; padding: 0 3px; border-radius: 3px; background: rgba(11,14,20,0.8); font-family: 'JetBrains Mono', monospace; font-size: 9px; color: {{ag.labelColor}}; pointer-events: none; transition: left .3s ease, top .3s ease\">{{ag.id}}<\/span>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div style=\"flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 16px; font-size: 13px\">\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8; margin-bottom: 8px\">MAP KEY · ZONES<\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 14px; height: 14px; border-radius: 4px; background: rgba(233,162,59,0.6); border: 1px solid #E9A23B\"><\/span><strong>G<\/strong> GPU cluster<\/span>\n            <span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 14px; height: 14px; border-radius: 4px; background: rgba(56,189,248,0.6); border: 1px solid #38BDF8\"><\/span><strong>B<\/strong> Fiber hub (bandwidth)<\/span>\n            <span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 14px; height: 14px; border-radius: 4px; background: rgba(155,225,93,0.6); border: 1px solid #9BE15D\"><\/span><strong>P<\/strong> Power station<\/span>\n            <span style=\"color: #8A94A8\">Fill = capacity left<\/span>\n          <\/div>\n        <\/div>\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8; margin-bottom: 8px\">MAP KEY · TENANTS<\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <sc-for list=\"{{legend}}\" as=\"lg\">\n              <span style=\"display: flex; align-items: center; gap: 8px\">\n                <span style=\"width: 18px; height: 18px; flex: none; border-radius: 50%; background: {{lg.color}}; color: #0B0E14; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; line-height: 18px; text-align: center\">{{lg.glyph}}<\/span>\n                <span>{{lg.name}}<\/span>\n                <span style=\"margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{lg.countColor}}\">{{lg.count}} on<\/span>\n              <\/span>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8; margin-bottom: 8px\">MAP KEY · LINES<\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 20px; height: 3px; background: #2DD4A7\"><\/span>Shared / swapped<\/span>\n            <span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 20px; height: 3px; background: #FF6B4A\"><\/span>Cheated / refused / grabbed<\/span>\n            <span style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 14px; height: 14px; box-sizing: border-box; border: 1px dashed #AEB6C6; border-radius: 3px\"><\/span>Selected tenant’s reach<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <div style=\"flex: 1 1 450px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n    <section aria-label=\"Commons health\" style=\"background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 18px\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8\">COMMONS HEALTH<\/span>\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: {{health.color}}\">{{health.label}}<\/span>\n      <\/div>\n      <div style=\"position: relative; height: 14px; margin-top: 10px; border-radius: 7px; background: linear-gradient(90deg, #FF6B4A 0%, #E9A23B 50%, #2DD4A7 100%)\">\n        <div style=\"position: absolute; top: -4px; left: calc({{health.pct}}% - 3px); width: 6px; height: 22px; border-radius: 3px; background: #E6EAF2; box-shadow: 0 0 0 2px #121722; transition: left .3s\"><\/div>\n      <\/div>\n      <div style=\"display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: #8A94A8\"><span>Collapsing<\/span><span>Strained<\/span><span>Healthy<\/span><\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px\">\n        <div style=\"padding: 10px 12px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\"><div style=\"font-size: 11px; color: #8A94A8\">Tenants online<\/div><div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700\">{{health.online}}<span style=\"font-size: 13px; color: #8A94A8\"> / 10<\/span><\/div><\/div>\n        <div style=\"padding: 10px 12px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\"><div style=\"font-size: 11px; color: #8A94A8\">Jobs served<\/div><div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700\">{{health.served}}%<\/div><\/div>\n        <div style=\"padding: 10px 12px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\"><div style=\"font-size: 11px; color: #8A94A8\">Zone reserves left<\/div><div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700\">{{health.reserve}}%<\/div><\/div>\n        <div style=\"padding: 10px 12px; border-radius: 10px; background: #0B0E14; border: 1px solid #1E2635\"><div style=\"font-size: 11px; color: #8A94A8\">Does cheating pay?<\/div><div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: {{health.cheatColor}}\">{{health.cheat}}<\/div><div style=\"font-size: 11px; color: #8A94A8\">{{health.cheatNote}}<\/div><\/div>\n      <\/div>\n    <\/section>\n\n    <section aria-label=\"Live leaderboard\" style=\"background: #121722; border: 1px solid #1E2635; border-radius: 16px; padding: 18px\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A94A8\">LIVE LEADERBOARD · RANKED BY CREDITS<\/span>\n        <span st
